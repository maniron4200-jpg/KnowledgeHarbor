<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مرسى المعرفة – لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2f14;--gold:#c9a227;--gold2:#e8c964;--soft:#fbf3dc;--line:#ead9a4;--err:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:Tajawal,Tahoma,sans-serif;background:#fffefa;color:var(--ink);display:none}
header{background:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--gold);box-shadow:0 2px 10px rgba(201,162,39,.18)}
header h1{margin:0;font-size:20px;color:var(--gold)}
header a{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;font-weight:700;text-decoration:none;border-radius:10px;padding:8px 12px;font-size:13px}
main{max-width:640px;margin:0 auto;padding:18px 16px}
.card{background:#fff;border:2px solid var(--gold);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(201,162,39,.12)}
h2{margin:0 0 10px;font-size:17px;color:var(--ink);padding-bottom:8px;border-bottom:2px solid var(--line)}
input,select,textarea{width:100%;padding:11px;margin:5px 0;border:1.5px solid var(--line);border-radius:10px;font:15px Tajawal,sans-serif;background:#fff;color:var(--ink)}
textarea{min-height:70px}
.add{width:100%;margin-top:6px;padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;font:800 15px Tajawal,sans-serif;cursor:pointer}
.sub{border-bottom:1px solid var(--line);padding:8px 0}
.prof{margin:6px 14px}
.prof img{width:32px;height:32px;border-radius:50%;object-fit:cover;vertical-align:middle;border:2px solid var(--line)}
.lec{margin:4px 28px;font-size:14px}
small{color:#9a8650}
.x{background:var(--err);color:#fff;border:0;border-radius:6px;padding:3px 9px;font:700 12px Tajawal,sans-serif;cursor:pointer;margin-right:6px}
.ph{background:var(--gold)}
.mv{background:var(--soft);color:var(--ink);border:1px solid var(--gold)}
.dirty{outline:3px solid var(--err)}
.cd{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:8px 0;font-size:14px}
</style>
</head>
<body>
<header><h1>⚙️ لوحة التحكم</h1><a href="home.html">🏠 الرئيسية</a></header>
<main>
  <div class="card" id="mig" style="display:none"><h2>📦 نقل البيانات إلى GitHub</h2><p style="margin:0 0 8px;font-size:14px">لازم تنقل المحاضرات مرة وحدة حتى تشتغل الإضافة والحذف والترتيب بدون Firebase.</p><button class="add" id="migBtn">📦 نقل البيانات الآن</button></div>
  <div class="card">
    <h2>📚 مادة جديدة</h2>
    <input id="sName" placeholder="اسم المادة">
    <input id="sTerm" placeholder="الفصل (مثلاً: الفصل الأول)">
    <button class="add" id="addS">➕ إضافة المادة</button>
  </div>
  <div class="card">
    <h2>👨‍🏫 أستاذ جديد</h2>
    <input id="pName" placeholder="اسم الأستاذ">
    <input id="pPhoto" placeholder="اسم صورة الأستاذ (مثلاً: IMG_20261026_140950_938.jpg)" dir="ltr">
    <select id="pSub"></select>
    <button class="add" id="addP">➕ إضافة الأستاذ</button>
  </div>
  <div class="card">
    <h2>🎬 محاضرة جديدة</h2>
    <select id="lSub"></select>
    <select id="lProf"></select>
    <input id="lTitle" placeholder="عنوان المحاضرة">
    <input id="lUrl" placeholder="رابط يوتيوب" dir="ltr">
    <textarea id="lDesc" placeholder="وصف (اختياري)"></textarea>
    <button class="add" id="addL">➕ إضافة المحاضرة</button>
  </div>
  <div class="card">
    <h2>🔑 أكواد الطلاب</h2>
    <input id="cName" placeholder="اسم الطالب">
    <button class="add" id="addC">➕ إنشاء كود</button>
    <p id="cNew" style="font-weight:800;font-size:20px;text-align:center;direction:ltr;margin:10px 0 0"></p>
    <div id="codes" style="margin-top:10px"></div>
  </div>
  <div class="card">
    <h2>🗂️ المحتوى الحالي</h2>
    <button class="add" id="saveO" style="margin-bottom:10px">💾 حفظ الترتيب</button>
    <div id="list"></div>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBpZeSTo-6oOe_s8fIcxzlbCXfw9j5Oujk",
  authDomain: "knowledgeharbor-30476.firebaseapp.com",
  projectId: "knowledgeharbor-30476",
  storageBucket: "knowledgeharbor-30476.firebasestorage.app",
  messagingSenderId: "280788802817",
  appId: "1:280788802817:web:f2a7aea087fab122790f00",
  measurementId: "G-KSD4JSVTGK"
};
const ADMIN = "maniron4200@gmail.com";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const val = id => $(id).value.trim();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, "").slice(0, 20) : String(Date.now()) + Math.random().toString(36).slice(2, 8));
let S = [], P = [], L = [], sha = null, migrated = false;

// ---- GitHub ----
const owner = location.hostname.split(".")[0];
const seg = location.pathname.split("/").filter(Boolean)[0];
const repo = (seg && !seg.includes(".")) ? seg : owner + ".github.io";
const API = "https://api.github.com/repos/" + owner + "/" + repo + "/contents/data.json";
const H = t => ({ "Authorization": "Bearer " + t, "Accept": "application/vnd.github+json" });
function token() {
  let t = localStorage.getItem("ghtoken");
  if (!t) t = (prompt("الصق مفتاح GitHub هنا (مرة وحدة فقط، ينحفظ بموبايلك):") || "").trim();
  return t;
}
async function ghGet(t) {
  const r = await fetch(API + "?t=" + Date.now(), { headers: H(t), cache: "no-store" });
  if (r.status === 404) return { data: null, sha: null };
  if (!r.ok) throw new Error("GitHub " + r.status);
  const j = await r.json();
  const txt = decodeURIComponent(escape(atob(j.content.replace(/\n/g, ""))));
  return { data: JSON.parse(txt), sha: j.sha };
}
async function ghPut(t, data, oldSha) {
  const body = { message: "update data", content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 1)))) };
  if (oldSha) body.sha = oldSha;
  const r = await fetch(API, { method: "PUT", headers: { ...H(t), "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) {
    if (r.status === 401 || r.status === 403) localStorage.removeItem("ghtoken");
    throw new Error("GitHub " + r.status);
  }
  localStorage.setItem("ghtoken", t);
  return (await r.json()).content.sha;
}
async function commit() {
  const t = token();
  if (!t) throw new Error("ما كو مفتاح");
  sha = await ghPut(t, { subjects: S, professors: P, lectures: L }, sha);
}

// ---- ترتيب ----
const ORD = ["اولي","ثاني","ثالث","رابع","خامس","سادس","سابع","ثامن","تاسع","عاشر"];
const ordNum = t => {
  let n = String(t || "").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه");
  const d = n.match(/\d+/);
  if (d) return +d[0];
  const i = ORD.findIndex(w => n.includes(w));
  return i < 0 ? Infinity : i + 1;
};
const baseKey = l => (typeof l.order === "number" ? l.order : 1e6 + ordNum(l.title));
function sortAll() {
  S.sort((a, b) => (a.name || "").localeCompare(b.name || "", "ar"));
  L.sort((a, b) => baseKey(a) - baseKey(b) || (a.title || "").localeCompare(b.title || "", "ar"));
}
let dirty = false;
function setDirty(v) { dirty = v; $("saveO").classList.toggle("dirty", v); }

onAuthStateChanged(auth, u => {
  if (!u || u.email !== ADMIN) { location.replace("home.html"); return; }
  document.body.style.display = "block";
  load();
  loadCodes();
});

async function loadFirestore() {
  const qs = await Promise.all(["subjects","professors","lectures"].map(n => getDocs(collection(db, n))));
  const m = q => q.docs.map(d => ({ id: d.id, ...d.data() }));
  S = m(qs[0]).map(x => ({ id: x.id, name: x.name || "", term: x.term || "" }));
  P = m(qs[1]).map(x => ({ id: x.id, name: x.name || "", photo: x.photo || "", subjectId: x.subjectId }));
  L = m(qs[2]).map(x => { const o = { id: x.id, title: x.title || "", url: x.url || "", desc: x.desc || "", subjectId: x.subjectId, professorId: x.professorId }; if (typeof x.order === "number") o.order = x.order; return o; });
}

async function load() {
  migrated = false;
  const t = localStorage.getItem("ghtoken");
  if (t) {
    try {
      const r = await ghGet(t);
      if (r.data) { S = r.data.subjects || []; P = r.data.professors || []; L = r.data.lectures || []; sha = r.sha; migrated = true; }
    } catch (e) { if (/401|403/.test(e.message)) localStorage.removeItem("ghtoken"); }
  }
  if (!migrated) {
    try { await loadFirestore(); } catch (e) { alert("خطأ بتحميل البيانات: " + (e.code || e.message)); }
  }
  sortAll();
  setDirty(false);
  render();
}

function opts(arr, label) {
  return arr.length ? arr.map(x => `<option value="${x.id}">${esc(label(x))}</option>`).join("") : `<option value="">— ما كو —</option>`;
}
function fillProfs() {
  $("lProf").innerHTML = opts(P.filter(p => p.subjectId === $("lSub").value), p => p.name);
}
$("lSub").onchange = fillProfs;

function render() {
  $("mig").style.display = migrated ? "none" : "block";
  const sv = $("lSub").value;
  $("pSub").innerHTML = opts(S, s => s.name + " (" + (s.term || "") + ")");
  $("lSub").innerHTML = opts(S, s => s.name + " (" + (s.term || "") + ")");
  if (sv && S.some(s => s.id === sv)) $("lSub").value = sv;
  fillProfs();
  $("list").innerHTML = S.map(s =>
    `<div class="sub"><b>📚 ${esc(s.name)}</b> <small>${esc(s.term)}</small> <button class="x" data-t="s" data-id="${s.id}">حذف</button>` +
    P.filter(p => p.subjectId === s.id).map(p =>
      `<div class="prof">${p.photo ? `<img src="${esc(p.photo)}" alt="">` : "👨‍🏫"} ${esc(p.name)} <button class="x ph" data-t="ph" data-id="${p.id}">صورة</button> <button class="x" data-t="p" data-id="${p.id}">حذف</button>` +
      L.filter(l => l.professorId === p.id).map((l, i) =>
        `<div class="lec"><small>${i + 1}</small> 🎬 ${esc(l.title)} <button class="x mv" data-t="up" data-id="${l.id}">⬆️</button><button class="x mv" data-t="dn" data-id="${l.id}">⬇️</button><button class="x" data-t="l" data-id="${l.id}">حذف</button></div>`).join("") +
      `</div>`).join("") +
    `</div>`).join("") || "<p>ما كو محتوى بعد.</p>";
}

// ينفّذ التعديل بالذاكرة ثم يحفظه بـ GitHub
async function act(fn) {
  if (!migrated) { alert("انقل البيانات إلى GitHub أولاً (الزر فوق)."); return false; }
  fn();
  sortAll();
  try { await commit(); setDirty(false); render(); return true; }
  catch (e) { alert("فشل الحفظ: " + e.message); await load(); return false; }
}

$("migBtn").onclick = async () => {
  const btn = $("migBtn");
  btn.disabled = true; btn.textContent = "⏳ جاري النقل...";
  try {
    const t = token();
    if (!t) throw new Error("ما كو مفتاح");
    await loadFirestore();
    let map = null;
    try { const r = await fetch("order.json?t=" + Date.now(), { cache: "no-store" }); if (r.ok) map = await r.json(); } catch (_) {}
    L.forEach(l => { if (map && typeof map[l.id] === "number") l.order = map[l.id]; });
    sortAll();
    L.forEach((l, i) => { l.order = i; });
    const cur = await ghGet(t);
    sha = await ghPut(t, { subjects: S, professors: P, lectures: L }, cur.sha);
    migrated = true;
    alert("تم نقل البيانات ✅");
    render();
  } catch (e) { alert("فشل النقل: " + e.message); }
  btn.disabled = false; btn.textContent = "📦 نقل البيانات الآن";
};

$("addS").onclick = async () => {
  if (!val("sName")) return alert("اكتب اسم المادة");
  const o = { id: uid(), name: val("sName"), term: val("sTerm") };
  if (await act(() => S.push(o))) { $("sName").value = ""; $("sTerm").value = ""; }
};
$("addP").onclick = async () => {
  if (!val("pName") || !$("pSub").value) return alert("اكتب اسم الأستاذ واختر المادة");
  const o = { id: uid(), name: val("pName"), photo: val("pPhoto"), subjectId: $("pSub").value };
  if (await act(() => P.push(o))) { $("pName").value = ""; $("pPhoto").value = ""; }
};
$("addL").onclick = async () => {
  if (!val("lTitle") || !val("lUrl") || !$("lSub").value || !$("lProf").value) return alert("اختر المادة والأستاذ واكتب العنوان والرابط");
  const mx = L.reduce((m, l) => Math.max(m, typeof l.order === "number" ? l.order : -1), -1);
  const o = { id: uid(), title: val("lTitle"), url: val("lUrl"), desc: val("lDesc"), subjectId: $("lSub").value, professorId: $("lProf").value, order: mx + 1 };
  if (await act(() => L.push(o))) { $("lTitle").value = ""; $("lUrl").value = ""; $("lDesc").value = ""; }
};

$("saveO").onclick = async () => {
  const btn = $("saveO");
  btn.disabled = true; btn.textContent = "⏳ جاري الحفظ...";
  await act(() => { L.forEach((l, i) => { l.order = i; }); });
  btn.disabled = false; btn.textContent = "💾 حفظ الترتيب";
};

$("list").onclick = async e => {
  const b = e.target.closest("button[data-id]");
  if (!b) return;
  const { t, id } = b.dataset;
  if (t === "up" || t === "dn") {
    const cur = L.find(x => x.id === id);
    const group = L.filter(x => x.professorId === cur.professorId);
    const gi = group.indexOf(cur);
    const other = group[t === "up" ? gi - 1 : gi + 1];
    if (!other) return;
    const a = L.indexOf(cur), c = L.indexOf(other);
    [L[a], L[c]] = [L[c], L[a]];
    L.forEach((l, i) => { l.order = i; });
    setDirty(true);
    render();
    return;
  }
  if (t === "ph") {
    const p = P.find(x => x.id === id);
    const name = prompt("اكتب اسم ملف الصورة (مثلاً: IMG_20261026_140950_938.jpg)", (p && p.photo) || "");
    if (name === null) return;
    await act(() => { p.photo = name.trim(); });
    return;
  }
  if (!confirm("متأكد من الحذف؟")) return;
  await act(() => {
    if (t === "s") {
      P = P.filter(x => x.subjectId !== id);
      L = L.filter(x => x.subjectId !== id);
      S = S.filter(x => x.id !== id);
    } else if (t === "p") {
      L = L.filter(x => x.professorId !== id);
      P = P.filter(x => x.id !== id);
    } else L = L.filter(x => x.id !== id);
  });
};

// ---- أكواد الطلاب ----
const genCode = () => {
  const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const a = crypto.getRandomValues(new Uint8Array(8));
  return [...a].map(n => c[n % c.length]).join("");
};
let C = [];
async function loadCodes() {
  try {
    const q = await getDocs(collection(db, "codes"));
    C = q.docs.map(d => ({ code: d.id, ...d.data() })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  } catch (e) {
    $("codes").innerHTML = "<small>تعذّر تحميل الأكواد: " + esc(e.code || e.message) + "</small>";
    return;
  }
  $("codes").innerHTML = C.map(c =>
    `<div class="cd"><span><b>${esc(c.name)}</b> <small>${c.usedBy ? "✅ مستخدم" : "⏳ غير مستخدم"}</small><br><code dir="ltr">${esc(c.code)}</code></span><span><button class="x mv" data-c="copy" data-id="${esc(c.code)}">نسخ</button><button class="x" data-c="del" data-id="${esc(c.code)}">حذف</button></span></div>`).join("") || "<small>ما كو أكواد بعد.</small>";
}
$("addC").onclick = async () => {
  if (!val("cName")) return alert("اكتب اسم الطالب");
  const code = genCode();
  try {
    await setDoc(doc(db, "codes", code), { name: val("cName"), usedBy: null, createdAt: Date.now() });
    $("cName").value = "";
    $("cNew").textContent = code;
    await loadCodes();
  } catch (e) { alert("فشل إنشاء الكود: " + (e.code || e.message)); }
};
$("codes").onclick = async e => {
  const b = e.target.closest("button[data-id]");
  if (!b) return;
  const c = C.find(x => x.code === b.dataset.id);
  if (!c) return;
  if (b.dataset.c === "copy") {
    try { await navigator.clipboard.writeText(c.code); alert("تم النسخ ✅"); }
    catch (_) { prompt("انسخ الكود:", c.code); }
    return;
  }
  if (!confirm(c.usedBy ? "حذف الكود وسحب صلاحية الطالب؟" : "حذف الكود؟")) return;
  try {
    if (c.usedBy) await deleteDoc(doc(db, "members", c.usedBy));
    await deleteDoc(doc(db, "codes", c.code));
    await loadCodes();
  } catch (e) { alert("فشل الحذف: " + (e.code || e.message)); }
};
</script>
</body>
</html>

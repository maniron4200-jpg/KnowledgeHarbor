<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مرسى المعرفة – الرئيسية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2f14;--gold:#c9a227;--gold2:#e8c964;--soft:#fbf3dc;--line:#ead9a4;--err:#b3261e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Tajawal,Tahoma,sans-serif;background:#fffefa;color:var(--ink);display:none}
header{background:#fff;color:var(--ink);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:3px solid var(--gold);box-shadow:0 2px 10px rgba(201,162,39,.18)}
header h1{margin:0;font-size:20px;color:var(--gold)}
header a,#out{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;border:0;border-radius:10px;padding:8px 12px;font:700 13px Tajawal,sans-serif;cursor:pointer;text-decoration:none}
main{max-width:640px;margin:0 auto;padding:18px 16px}
h2{margin:0 0 14px;color:var(--ink);font-size:20px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:#fff;border:2px solid var(--gold);border-radius:14px;padding:12px 14px;margin-bottom:10px;font:700 16px Tajawal,sans-serif;color:var(--ink);cursor:pointer;box-shadow:0 2px 8px rgba(201,162,39,.12)}
.item:active{background:var(--soft)}
.item small{display:block;color:#9a8650;font-weight:400;margin-top:2px}
.ico{flex:none;width:46px;height:46px;border-radius:50%;background:var(--soft);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:23px;overflow:hidden}
.ico img{width:100%;height:100%;object-fit:cover}
.back{background:none;border:0;color:var(--gold);font:700 15px Tajawal,sans-serif;cursor:pointer;padding:0 0 10px}
.lec{background:#fff;border:2px solid var(--line);border-right:5px solid var(--gold);border-radius:12px;padding:14px;margin-bottom:12px}
.lec h3{margin:0 0 6px;font-size:16px}
.lec p{margin:6px 0 0;font-size:14px;color:#7a6c47}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;margin-top:8px}
.lec a{color:var(--gold);font-weight:700}
.gate{background:#fff;border:2px solid var(--gold);border-radius:14px;padding:20px}
.gate input{width:100%;padding:12px;margin:8px 0;border:1.5px solid var(--line);border-radius:10px;font:16px Tajawal,sans-serif}
.err{color:var(--err);font-weight:700;min-height:22px}

body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none;pointer-events:none}
#wm{position:fixed;inset:0;z-index:9999;pointer-events:none}
body.hide main{filter:blur(28px);pointer-events:none}
@media print{body{display:none!important}}
</style>
</head>
<body>
<header>
  <h1>🎓 مرسى المعرفة</h1>
  <span><a id="adminLink" href="admin.html" style="display:none">⚙️ التحكم</a> <button id="out">🚪 خروج</button></span>
</header>
<div id="wm"></div>
<main id="app">⏳ جارٍ التحميل...</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBpZeSTo-6oOe_s8fIcxzlbCXfw9j5Oujk",
  authDomain: "knowledgeharbor-30476.firebaseapp.com",
  projectId: "knowledgeharbor-30476",
  storageBucket: "knowledgeharbor-30476.firebasestorage.app",
  messagingSenderId: "280788802817",
  appId: "1:280788802817:web:f2a7aea087fab122790f00",
  measurementId: "G-KSD4JSVTGK"
};
const ADMIN = "maniron4200@gmail.com";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S = [], P = [], L = [], sel = { s: null, p: null }, me = null;

const ICONS = [["فيزياء","⚛️"],["كيمياء","🧪"],["أحياء","🧬"],["احياء","🧬"],["رياضيات","📐"],["عربي","📖"],["عربية","📖"],["انكليزي","🔤"],["إنكليزي","🔤"],["english","🔤"],["اسلامية","🕌"],["إسلامية","🕌"],["تاريخ","🏛️"],["جغرافية","🌍"],["حاسوب","💻"]];
const icon = n => { n = String(n || ""); const f = ICONS.find(([k]) => n.includes(k)); return f ? f[1] : "📘"; };

onAuthStateChanged(auth, async u => {
  if (!u) { location.replace("login.html"); return; }
  me = u;
  setWm(u.email);
  document.body.style.display = "block";
  if (u.email === ADMIN) { $("adminLink").style.display = ""; load(); return; }
  try {
    const m = await getDoc(doc(db, "members", u.uid));
    if (m.exists()) { load(); return; }
  } catch (e) {}
  showGate();
});
$("out").onclick = async () => { await signOut(auth); location.replace("login.html"); };

function showGate() {
  $("app").innerHTML = `<div class="gate"><h2>🔑 كود الدخول</h2><p>اكتب الكود الي أعطاك إياه المشرف.</p><input id="code" dir="ltr" placeholder="الكود" autocomplete="off"><button class="item" id="codeBtn" style="justify-content:center">✅ دخول</button><p class="err" id="codeMsg"></p></div>`;
  $("codeBtn").onclick = async () => {
    const code = $("code").value.trim();
    if (!code) return;
    $("codeMsg").textContent = "";
    try {
      await setDoc(doc(db, "members", me.uid), { code, email: me.email });
      await load();
    } catch (e) {
      $("codeMsg").textContent = e.code === "permission-denied" ? "الكود غير صحيح." : "حدث خطأ: " + e.code;
    }
  };
}

async function load() {
  try {
    const qs = await Promise.all(["subjects","professors","lectures"].map(n => getDocs(collection(db, n))));
    const m = q => q.docs.map(d => ({ id: d.id, ...d.data() }));
    S = m(qs[0]); P = m(qs[1]); L = m(qs[2]);
    S.sort((a,b) => (a.name||"").localeCompare(b.name||"", "ar"));
    render();
  } catch (e) { $("app").textContent = "تعذّر تحميل المحتوى: " + e.code; }
}

function ytEmbed(url) {
  const m = String(url).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  return m ? `<iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" allowfullscreen></iframe>` : "";
}

function render() {
  const app = $("app");
  if (!sel.s) {
    app.innerHTML = "<h2>📚 المواد الدراسية</h2>" + (S.map(s =>
      `<button class="item" data-s="${s.id}"><span class="ico">${icon(s.name)}</span><span>${esc(s.name)}<small>🗓️ ${esc(s.term)}</small></span></button>`).join("") || "<p>ما كو مواد بعد.</p>");
  } else if (!sel.p) {
    const s = S.find(x => x.id === sel.s);
    app.innerHTML = `<button class="back" data-back="s">→ رجوع للمواد</button><h2>${icon(s?.name)} ${esc(s?.name)}</h2>` +
      (P.filter(p => p.subjectId === sel.s).map(p =>
        `<button class="item" data-p="${p.id}"><span class="ico">${p.photo ? `<img src="${esc(p.photo)}" alt="">` : "👨‍🏫"}</span><span>${esc(p.name)}</span></button>`).join("") || "<p>ما كو أساتذة بعد.</p>");
  } else {
    const p = P.find(x => x.id === sel.p);
    app.innerHTML = `<button class="back" data-back="p">→ رجوع للأساتذة</button><h2>👨‍🏫 ${esc(p?.name)}</h2>` +
      (L.filter(l => l.professorId === sel.p).map(l =>
        `<div class="lec"><h3>🎬 ${esc(l.title)}</h3>${ytEmbed(l.url)}<p><a href="${esc(l.url)}" target="_blank" rel="noopener">▶️ فتح على يوتيوب</a></p>${l.desc ? `<p>📝 ${esc(l.desc)}</p>` : ""}</div>`).join("") || "<p>ما كو محاضرات بعد.</p>");
  }
}

$("app").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.s) sel = { s: b.dataset.s, p: null };
  else if (b.dataset.p) sel.p = b.dataset.p;
  else if (b.dataset.back === "s") sel = { s: null, p: null };
  else if (b.dataset.back === "p") sel.p = null;
  else return;
  render();
};
// ===== حماية المحتوى =====
function setWm(email) {
  const t = esc(email || "");
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="260" height="170"><text x="20" y="100" transform="rotate(-25 130 85)" font-family="Tahoma,sans-serif" font-size="15" fill="rgba(120,90,10,0.16)">${t}</text></svg>`;
  $("wm").style.backgroundImage = `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
}
const hideNow = () => document.body.classList.add("hide");
const showNow = () => document.body.classList.remove("hide");
document.addEventListener("visibilitychange", () => document.hidden ? hideNow() : showNow());
document.addEventListener("contextmenu", e => e.preventDefault());
["copy","cut","dragstart"].forEach(ev => document.addEventListener(ev, e => { if (!/INPUT|TEXTAREA/.test(e.target.tagName)) e.preventDefault(); }));
document.addEventListener("keyup", e => {
  if (e.key === "PrintScreen") { hideNow(); try { navigator.clipboard.writeText(""); } catch (_) {} setTimeout(showNow, 1500); }
});
document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && ["s","p","u","c"].includes(k) && !/INPUT|TEXTAREA/.test(e.target.tagName)) e.preventDefault();
  if (e.key === "F12") e.preventDefault();
});
</script>
</body>
</html>

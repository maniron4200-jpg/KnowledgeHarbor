<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Harbor | مرسى المعرفة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"light"}catch(e){}</script>
<style>
:root{
  --ink:#1b2b48;
  --gold:#c9a227;
  --gold2:#e8c964;
  --gold-light:#f5dfa0;
  --soft:#f5efe0;
  --line:#e2d1a0;
  --err:#b3261e;
  --bg:#f6f2e8;
  --card:#fcfaf5;
  --muted:#7c7052;
  --muted2:#5e543c;
  --donebg:#edf7ed;
  --navy:#0c1b33;
  --navy2:#162d54;
}
:root[data-theme=dark]{
  --navy:#9fb6dc;
  --ink:#f3e9c8;
  --soft:#251f11;
  --line:#4a3f1c;
  --bg:#0b1322;
  --card:#132038;
  --muted:#a6986a;
  --muted2:#c9bb8c;
  --donebg:#13291b;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Tajawal',Tahoma,sans-serif;background:var(--bg);color:var(--ink);display:none;overflow-x:hidden;padding-bottom:76px}

/* ===== الهيدر والواجهة العلوية والحركات الحية ===== */
.hero-wrapper{
  position:relative;
  background:linear-gradient(180deg, #071224 0%, #0f2342 55%, #18335c 85%, var(--bg) 100%);
  padding-bottom:26px;
  overflow:hidden;
}
.hero-art{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:0;
}
@keyframes sweepBeam {
  0%, 100% { transform: rotate(-3deg); opacity: 0.88; }
  50% { transform: rotate(4deg); opacity: 1; }
}
@keyframes twinkleStar {
  0%, 100% { opacity: 0.25; transform: scale(0.85); }
  50% { opacity: 1; transform: scale(1.2); }
}
@keyframes floatCloud {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(10px); }
}
.lh-beam { transform-origin: 132px 126px; animation: sweepBeam 8s ease-in-out infinite; }
.tw-1 { animation: twinkleStar 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.tw-2 { animation: twinkleStar 4.5s ease-in-out 1.2s infinite; transform-box: fill-box; transform-origin: center; }
.clouds-anim { animation: floatCloud 14s ease-in-out infinite; }

header{
  position:relative;
  z-index:5;
  max-width:640px;
  margin:0 auto;
  padding:16px 16px 6px;
}
.hrow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  direction:rtl;
  gap:10px;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}
.logo{
  flex:none;
  width:68px;
  height:68px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #19335e, #09152b);
  border:2px solid var(--gold2);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 18px rgba(0,0,0,.5), 0 0 12px rgba(232,201,100,.3);
  position:relative;
}
.logo svg{width:54px;height:54px;display:block}
.vsep{
  width:1.5px;
  height:48px;
  background:linear-gradient(180deg,transparent,var(--gold2),transparent);
}
.bt{
  display:flex;
  flex-direction:column;
  align-items:center;
  line-height:1.2;
  min-width:0;
}
header h1{
  margin:0;
  font-size:25px;
  font-weight:900;
  color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.45);
}
.en{
  direction:ltr;
  font:700 13px 'Tajawal',sans-serif;
  letter-spacing:.6px;
  color:var(--gold2);
  margin-top:3px;
  display:flex;
  align-items:center;
  gap:6px;
}
.en::before,.en::after{
  content:"";
  width:14px;
  height:1.5px;
  background:var(--gold2);
  opacity:.75;
}
.hbtns{display:flex;gap:8px;align-items:center}
#bellBtn,#menuBtn{
  width:44px;
  height:44px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold2);
  cursor:pointer;
  background:rgba(12,26,52,.7);
  border:1.5px solid rgba(232,201,100,.65);
  border-radius:13px;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
  backdrop-filter:blur(6px);
}
#bellBtn svg,#menuBtn svg{width:22px;height:22px}

.hero-slogan{
  position:relative;
  z-index:2;
  max-width:640px;
  margin:14px auto 18px;
  padding:0 22px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
}
.hero-slogan span{
  color:#fff;
  font-size:20px;
  font-weight:800;
  text-shadow:0 2px 10px rgba(0,0,0,.65);
  letter-spacing:.2px;
}
.hero-slogan i{
  display:block;
  width:150px;
  height:3px;
  margin-top:5px;
  border-radius:4px;
  background:linear-gradient(90deg, var(--gold2), transparent);
}

#menu{display:none;position:absolute;left:16px;right:auto;top:70px;z-index:50;background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:8px;min-width:195px;box-shadow:0 10px 28px rgba(0,0,0,.35)}
#menu.open{display:block}
#menu a,#menu button{display:block;width:100%;text-align:right;background:none;border:0;border-radius:10px;padding:10px 12px;font:700 14px Tajawal,sans-serif;color:var(--ink);cursor:pointer;text-decoration:none}
#menu a:active,#menu button:active{background:var(--soft)}

/* ===== شريط الإحصائيات الزجاجي ===== */
.stats{
  position:relative;
  z-index:3;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-bottom:14px;
}
.stat{
  background:linear-gradient(160deg, rgba(26,48,84,.82), rgba(11,23,44,.9));
  border:1.5px solid rgba(232,201,100,.6);
  border-radius:18px;
  padding:11px 4px 10px;
  text-align:center;
  box-shadow:0 6px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.15);
  backdrop-filter:blur(8px);
  color:#fff;
}
.stat .sico{
  width:34px;
  height:34px;
  margin:0 auto 5px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(232,201,100,.22), rgba(201,162,39,.05));
  border:1.5px solid rgba(232,201,100,.65);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold2);
}
.stat .sico svg{width:18px;height:18px}
.stat b{
  display:block;
  font-size:20px;
  font-weight:900;
  color:#fff;
  line-height:1.15;
  direction:ltr;
}
.stat small{
  color:#d0d9ec;
  font-size:12px;
  font-weight:700;
  display:block;
  margin-top:2px;
}

/* ===== بطاقة السلسلة والهدف والامتحان والأوسمة ===== */
.after-hero{
  max-width:640px;
  margin:-14px auto 0;
  padding:0 16px;
  position:relative;
  z-index:4;
}
.streak-card{
  display:flex;
  align-items:center;
  gap:14px;
  background:linear-gradient(135deg, var(--card) 0%, var(--soft) 100%);
  border:2px solid var(--gold);
  border-radius:22px;
  padding:12px 16px;
  margin-bottom:10px;
  box-shadow:0 6px 18px rgba(201,162,39,.18);
  position:relative;
  overflow:hidden;
}
.streak-card::after{
  content:"";
  position:absolute;
  left:-18px;
  top:-18px;
  width:80px;
  height:140%;
  background:linear-gradient(135deg, rgba(201,162,39,.25), transparent);
  transform:rotate(-20deg);
  pointer-events:none;
}
.streak-orb{
  flex:none;
  width:52px;
  height:52px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff7db, #f1cf65 65%, #c9961a 100%);
  border:2px solid #fff;
  box-shadow:0 4px 12px rgba(201,162,39,.4);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#9c6b08;
}
.streak-orb svg{width:28px;height:28px;fill:currentColor}
.streak-info{flex:1;min-width:0}
.streak-info b{
  display:block;
  font-size:19px;
  font-weight:900;
  color:var(--ink);
}
.streak-info small{
  display:block;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
  margin-top:2px;
}
.cloud-pill{
  font-size:11px;
  font-weight:800;
  color:var(--gold);
  background:rgba(201,162,39,.12);
  border:1px solid var(--line);
  padding:3px 8px;
  border-radius:99px;
  white-space:nowrap;
}

.goal-card{
  background:linear-gradient(135deg, var(--card), var(--soft));
  border:1.8px solid var(--line);
  border-radius:18px;
  padding:10px 14px;
  margin-bottom:10px;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
}
.goal-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:14px;
  font-weight:800;
  color:var(--ink);
  margin-bottom:7px;
}
.goal-top .gl-r{display:flex;align-items:center;gap:6px}
.goal-top .gl-r svg{width:18px;height:18px;color:var(--gold)}
.goal-top button{
  background:none;
  border:0;
  color:var(--gold);
  font:800 12px Tajawal,sans-serif;
  cursor:pointer;
  padding:2px 6px;
}
.bar{
  height:10px;
  background:rgba(180,160,110,.22);
  border:1px solid var(--line);
  border-radius:99px;
  overflow:hidden;
}
.bar i{
  display:block;
  height:100%;
  border-radius:99px;
  background:linear-gradient(90deg, #b88714, var(--gold2));
  transition:width .3s ease;
}

/* عداد الامتحان التنازلي */
.exam-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:linear-gradient(135deg, #0d1f3c, #183460);
  color:#fff;
  border:1.5px solid var(--gold);
  border-radius:18px;
  padding:10px 14px;
  margin-bottom:10px;
  box-shadow:0 5px 15px rgba(12,27,51,.25);
}
.exam-l{display:flex;align-items:center;gap:10px;min-width:0}
.exam-days{
  background:linear-gradient(135deg, var(--gold2), var(--gold));
  color:#0c1b33;
  font-weight:900;
  border-radius:12px;
  padding:5px 10px;
  text-align:center;
  line-height:1.1;
  flex:none;
}
.exam-days b{display:block;font-size:18px}
.exam-days small{font-size:10px;font-weight:800}
.exam-txt b{display:block;font-size:14px;color:var(--gold2)}
.exam-txt small{display:block;font-size:12px;color:#d0d9ec}
.exam-btn{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(232,201,100,.5);
  color:var(--gold2);
  border-radius:10px;
  padding:5px 9px;
  font:700 12px Tajawal,sans-serif;
  cursor:pointer;
  flex:none;
}

/* شريط الأوسمة البحرية */
.badges-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  background:var(--card);
  border:1.5px solid var(--line);
  border-radius:18px;
  padding:8px 12px;
  margin-bottom:14px;
  cursor:pointer;
}
.badges-list{display:flex;gap:6px;align-items:center;overflow-x:auto}
.bdg-mini{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
  background:var(--soft);
  border:1.5px solid var(--line);
  filter:grayscale(1);opacity:.45;
  transition:.2s;
  flex:none;
}
.bdg-mini.on{
  filter:none;opacity:1;
  background:radial-gradient(circle, #fff8dc, #f1d272);
  border-color:var(--gold);
  box-shadow:0 2px 8px rgba(201,162,39,.35);
}
.badges-lbl{font-size:13px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:6px;white-space:nowrap}
.badges-lbl small{color:var(--gold);font-weight:800}

/* ===== وضع التركيز وحلقة التقدم وبومودورو ===== */
#focus{
  position:relative;
  display:flex;
  background:
    radial-gradient(circle at 50% 34%, rgba(232,201,100,.18), transparent 48%),
    linear-gradient(165deg, #09172e 0%, #102548 55%, #0a1830 100%);
  border:2px solid var(--gold);
  box-shadow:0 12px 28px rgba(8,20,42,.45), inset 0 0 24px rgba(232,201,100,.08);
  color:#eef2fb;
  flex-direction:column;
  align-items:center;
  gap:11px;
  padding:18px 14px 20px;
  border-radius:26px;
  max-width:640px;
  margin:0 auto 14px;
  overflow:hidden;
  transition:background .4s ease, border-color .4s ease;
}
#focus.break-mode{
  background:
    radial-gradient(circle at 50% 34%, rgba(79,195,247,.22), transparent 50%),
    linear-gradient(165deg, #082233 0%, #0e3952 55%, #071d2b 100%);
  border-color:#4fc3f7;
}
#focus::before{
  content:"";
  position:absolute;
  right:-10px;
  top:52px;
  width:95px;
  height:110px;
  opacity:.18;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 120' fill='none' stroke='%239fb6dc' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'><circle cx='50' cy='20' r='9'/><line x1='50' y1='29' x2='50' y2='98'/><line x1='30' y1='45' x2='70' y2='45'/><path d='M18 72 C18 98 50 104 50 104 C50 104 82 98 82 72'/><polyline points='12 78 18 68 26 76'/><polyline points='88 78 82 68 74 76'/></svg>") no-repeat center/contain;
  pointer-events:none;
}
#focus::after{
  content:"";
  position:absolute;
  left:-6px;
  top:42px;
  width:96px;
  height:125px;
  opacity:.26;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 110 130'><g stroke='%23e8c964' stroke-width='2' fill='%2316305a'><rect x='6' y='96' width='90' height='18' rx='4'/><rect x='12' y='74' width='80' height='18' rx='4'/><rect x='8' y='52' width='74' height='18' rx='4'/><rect x='16' y='30' width='66' height='18' rx='4'/></g><g stroke='%23f5dfa0' stroke-width='1.5'><line x1='14' y1='105' x2='88' y2='105'/><line x1='20' y1='83' x2='84' y2='83'/><line x1='16' y1='61' x2='74' y2='61'/><line x1='22' y1='39' x2='74' y2='39'/></g></svg>") no-repeat center/contain;
  pointer-events:none;
}
#focus svg{display:block}
#focus .ftop{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
  padding:0 6px;
  font-weight:800;
  font-size:15px;
  color:#fff;
}
#focus .ftop span{display:inline-flex;align-items:center;gap:6px}
#focus .ftop #fpts{color:var(--gold2)}

/* حلقة التقدم التفاعلية حول المؤقت */
.timer-ring{
  position:relative;
  z-index:2;
  width:210px;
  height:168px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  margin:0;
}
.ring-svg{
  position:absolute;
  width:166px;
  height:166px;
  transform:rotate(-90deg);
  pointer-events:none;
  filter:drop-shadow(0 0 10px rgba(232,201,100,.45));
}
.ring-bg{
  fill:none;
  stroke:rgba(255,255,255,.12);
  stroke-width:6;
}
.ring-fg{
  fill:none;
  stroke:var(--gold2);
  stroke-width:6.5;
  stroke-linecap:round;
  stroke-dasharray:440;
  stroke-dashoffset:440;
  transition:stroke-dashoffset .6s linear, stroke .3s ease;
}
@keyframes ringPulse{
  0%,100%{filter:drop-shadow(0 0 8px rgba(232,201,100,.45))}
  50%{filter:drop-shadow(0 0 18px rgba(232,201,100,.9))}
}
#focus.running .ring-svg{animation:ringPulse 2.4s ease-in-out infinite}
#focus.goal-done .ring-fg{stroke:#4caf50}
#focus.break-mode .ring-fg{stroke:#4fc3f7}

#focus .ft{
  position:relative;
  z-index:3;
  background:rgba(7,17,36,.88);
  border:1.5px solid rgba(232,201,100,.45);
  padding:9px 18px;
  border-radius:18px;
  font-size:38px;
  font-weight:900;
  color:#fff;
  line-height:1;
  letter-spacing:2px;
  direction:ltr;
  font-variant-numeric:tabular-nums;
  text-shadow:0 2px 10px rgba(0,0,0,.6);
}
.ring-sub{
  position:relative;
  z-index:3;
  font-size:11px;
  font-weight:800;
  color:var(--gold2);
  margin-top:5px;
  background:rgba(7,17,36,.75);
  padding:2px 9px;
  border-radius:99px;
}
#focus .fbarw{display:none}
#focus .fchain{
  position:relative;
  z-index:2;
  width:100%;
  background:rgba(10,23,47,.78);
  border-top:1px solid rgba(232,201,100,.25);
  border-bottom:1px solid rgba(232,201,100,.25);
  border-radius:16px;
  padding:10px 12px;
}
#focus .fch{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px;margin-bottom:8px;color:#eef2fb}
#focus .fch b{display:inline-flex;align-items:center;gap:6px;color:#eef2fb}
#focus .fch b svg{color:#e8c964}
#focus .fch span{color:#e8c964}
#focus .fchrow{display:flex;align-items:center;direction:ltr}
#focus .nd{
  width:28px;
  height:28px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #243e6e, #0e1e3b);
  border:2px solid #496699;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  color:#0f2145;
  box-shadow:inset 0 2px 4px rgba(255,255,255,.15);
}
#focus .nd.on{
  background:radial-gradient(circle at 35% 30%, #fff3c4, #e8c964 60%, #b88714);
  border-color:#fff;
  box-shadow:0 0 12px rgba(232,201,100,.8);
}
#focus .nd.td{
  border-color:var(--gold2);
  box-shadow:0 0 10px rgba(232,201,100,.55);
}
#focus .ln{flex:1;height:2.5px;background:#355082;border-radius:2px}
#focus .ln.on{background:linear-gradient(90deg,var(--gold),var(--gold2))}
#focus .fdays{display:flex;justify-content:space-between;font-size:11px;margin-top:6px;color:#b8c7e6;direction:ltr}
#focus .fdays span{width:28px;text-align:center}

#focus .fchips{
  position:relative;
  z-index:2;
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:center;
  width:100%;
}
#focus .fchips button{
  background:rgba(15,33,69,.85);
  border:1.5px solid rgba(159,182,220,.38);
  color:#eef2fb;
  font:700 12.5px Tajawal,sans-serif;
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:6px 12px;
  border-radius:99px;
  cursor:pointer;
  transition:.2s;
}
#focus .fchips button.on{
  background:linear-gradient(135deg, #f3d778, #c9981e);
  border-color:#fff3c4;
  color:#0c1b33;
  font-weight:900;
  box-shadow:0 3px 12px rgba(232,201,100,.45);
}
#focus .frow{position:relative;z-index:2;display:flex;justify-content:center;width:100%;margin-top:2px}
#focus #fEnd{
  min-width:220px;
  padding:11px 32px;
  border-radius:99px;
  background:linear-gradient(135deg, #f5dca2 0%, #dca934 55%, #b88412 100%);
  border:2px solid #fff3c4;
  color:#0c1b33;
  font:900 18px Tajawal,sans-serif;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(220,169,52,.45);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
#focus #fEnd.end{
  background:linear-gradient(135deg, #e0463c, #9e1c15);
  border-color:#ffb4ab;
  color:#fff;
}

/* ===== شريط البحث والفلاتر العلوية ===== */
.search-hub{
  max-width:640px;
  margin:10px auto 0;
  padding:0 16px;
}
#searchWrap{
  display:none;
}
.search-box{
  position:relative;
  display:flex;
  align-items:center;
}
#q{
  width:100%;
  padding:12px 16px;
  border:2px solid var(--gold);
  border-radius:99px;
  font:700 15px Tajawal,sans-serif;
  background:var(--card);
  color:var(--ink);
  box-shadow:0 4px 14px rgba(201,162,39,.14);
}
#q::placeholder{color:var(--muted)}
.filter-pills{
  display:flex;
  gap:7px;
  margin-top:9px;
  overflow-x:auto;
  padding-bottom:2px;
}
.filter-pills button{
  flex:none;
  padding:6px 14px;
  border-radius:99px;
  border:1.5px solid var(--line);
  background:var(--card);
  color:var(--ink);
  font:800 13px Tajawal,sans-serif;
  cursor:pointer;
  transition:.2s;
}
.filter-pills button.on{
  background:linear-gradient(135deg, var(--gold), var(--gold2));
  border-color:var(--gold);
  color:#0c1b33;
}
#results{
  margin-top:10px;
}

/* ===== المحتوى الرئيسي والمواد والمحاضرات ===== */
main{max-width:640px;margin:0 auto;padding:12px 16px 24px}
main h2{
  margin:4px 0 14px;
  color:var(--ink);
  font-size:21px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:10px;
  border:0;
}
main h2::after{
  content:"";
  flex:1;
  height:2px;
  background:linear-gradient(90deg, var(--gold), transparent);
}
.item{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  text-align:right;
  background:linear-gradient(135deg, var(--card), var(--soft));
  border:2px solid var(--gold);
  border-radius:99px;
  padding:10px 12px 10px 18px;
  margin-bottom:11px;
  font:800 17px Tajawal,sans-serif;
  color:var(--ink);
  cursor:pointer;
  box-shadow:0 6px 16px rgba(201,162,39,.16);
  position:relative;
  transition:transform .15s ease;
}
.item:active{transform:scale(.99);background:var(--soft)}
.item > span:nth-child(2){flex:1;min-width:0}
.item small{display:block;color:var(--muted);font-weight:700;font-size:13px;margin-top:2px}
.item::after{
  content:"‹";
  font-size:26px;
  font-weight:900;
  color:var(--gold);
  line-height:1;
  margin-right:6px;
}
.ico{
  flex:none;
  width:52px;
  height:52px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #1c3664, #0c1b36);
  border:2px solid var(--gold2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  overflow:hidden;
  color:var(--gold2);
  box-shadow:0 3px 10px rgba(12,27,54,.35);
}
.ico img{width:100%;height:100%;object-fit:cover}
.back{background:none;border:0;color:var(--gold);font:800 15px Tajawal,sans-serif;cursor:pointer;padding:0 0 10px}
.lec{background:var(--card);border:2px solid var(--line);border-right:5px solid var(--gold);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.lec-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.lec h3{margin:0;font-size:16px;flex:1}
.bm-btn{
  flex:none;
  background:var(--soft);
  border:1.5px solid var(--line);
  border-radius:10px;
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;cursor:pointer;
  transition:.2s;
}
.bm-btn.on{background:#fff3c4;border-color:var(--gold);transform:scale(1.06)}
.lec p{margin:6px 0 0;font-size:14px;color:var(--muted2)}
.lec.hl{animation:hl 1.8s ease}
@keyframes hl{0%,60%{box-shadow:0 0 0 4px var(--gold)}100%{box-shadow:0 0 0 0 transparent}}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;margin-top:8px}
.lec a{color:var(--gold);font-weight:700}

/* ملاحظات الطالب على المحاضرة */
.lec-actions{display:flex;gap:8px;margin-top:10px}
.lec-actions .chk{margin-top:0;flex:2}
.note-btn{
  flex:1;
  padding:10px 8px;
  border:2px solid var(--line);
  background:var(--card);
  border-radius:10px;
  font:700 13.5px Tajawal,sans-serif;
  color:var(--ink);
  cursor:pointer;
}
.note-btn.has{border-color:var(--gold);background:var(--soft)}
.lec-note-view{
  margin-top:8px;
  padding:9px 12px;
  background:var(--soft);
  border-right:3px solid var(--gold);
  border-radius:8px;
  font-size:13.5px;
  color:var(--ink);
  white-space:pre-wrap;
  line-height:1.6;
}
.lec-note-box{margin-top:8px;display:none}
.lec-note-box.open{display:block}
.lec-note-box textarea{
  width:100%;
  padding:10px;
  border:1.5px solid var(--gold);
  border-radius:10px;
  font:14px Tajawal,sans-serif;
  background:var(--bg);
  color:var(--ink);
}
.lec-note-box .row{display:flex;gap:6px;margin-top:6px}
.lec-note-box button{flex:1;padding:8px;border-radius:8px;border:0;font:700 13px Tajawal,sans-serif;cursor:pointer}
.lec-note-box .nsave{background:var(--gold);color:#fff}
.lec-note-box .ncancel{background:var(--soft);color:var(--ink)}

.gate{background:var(--card);border:2px solid var(--gold);border-radius:18px;padding:20px}
.gate input{width:100%;padding:12px;margin:8px 0;border:1.5px solid var(--line);border-radius:10px;font:16px Tajawal,sans-serif;background:var(--bg);color:var(--ink)}
.err{color:var(--err);font-weight:700;min-height:22px}
.mv{display:flex;gap:8px;margin-top:10px}
.mv button{flex:1;padding:8px;border:2px solid var(--gold);background:var(--soft);border-radius:10px;font:700 15px Tajawal,sans-serif;color:var(--ink);cursor:pointer}
.mv button:active{background:var(--gold2)}
.save{width:100%;padding:12px;margin-bottom:14px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;font:800 15px Tajawal,sans-serif;cursor:pointer}
.save.dirty{outline:3px solid var(--err)}
.cont{
  width:100%;
  margin-top:8px;
  padding:11px 14px;
  border:2px solid var(--gold);
  border-radius:99px;
  background:linear-gradient(135deg,var(--card),var(--soft));
  color:var(--ink);
  font:800 14px Tajawal,sans-serif;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  box-shadow:0 4px 12px rgba(201,162,39,.15);
}
.cont:active{background:var(--gold2)}

/* ===== الفوتر السفلي وشريط التنقل الثابت ===== */
.bottom-bar{
  position:relative;
  background:linear-gradient(180deg, var(--bg) 0%, #0d1e3a 32%, #081326 100%);
  padding:30px 16px 24px;
  margin-top:12px;
  overflow:hidden;
}
.bottom-bar::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:36px;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 40' preserveAspectRatio='none'><path d='M0 8 Q110 38 230 18 T400 22 L400 0 L0 0 Z' fill='%23f6f2e8'/><path d='M0 10 Q110 40 230 20 T400 24' fill='none' stroke='%23c9a227' stroke-width='3'/></svg>") no-repeat top/100% 100%;
  pointer-events:none;
}
:root[data-theme=dark] .bottom-bar::before{
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 40' preserveAspectRatio='none'><path d='M0 8 Q110 38 230 18 T400 22 L400 0 L0 0 Z' fill='%230b1322'/><path d='M0 10 Q110 40 230 20 T400 24' fill='none' stroke='%23c9a227' stroke-width='3'/></svg>") no-repeat top/100% 100%;
}
.bottom-inner{
  max-width:640px;
  margin:8px auto 0;
  display:flex;
  align-items:center;
  justify-content:center;
}
.bottom-motto{
  color:var(--gold2);
  font-weight:800;
  font-size:16px;
  text-shadow:0 2px 8px rgba(0,0,0,.5);
}

/* شريط التنقل السفلي الثابت */
.bnav{
  position:fixed;
  bottom:0;left:0;right:0;
  z-index:45;
  background:rgba(10,22,44,.94);
  backdrop-filter:blur(10px);
  border-top:1.5px solid rgba(232,201,100,.45);
  display:flex;
  justify-content:space-around;
  align-items:center;
  max-width:640px;
  margin:0 auto;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
  border-radius:20px 20px 0 0;
  box-shadow:0 -6px 20px rgba(0,0,0,.35);
}
.bnav button{
  flex:1;
  background:none;
  border:0;
  color:#9fb2d6;
  font:700 11.5px Tajawal,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  padding:4px 0;
  cursor:pointer;
  transition:.2s;
}
.bnav button span.bico{font-size:19px;line-height:1}
.bnav button.on{color:var(--gold2);font-weight:900;transform:translateY(-2px)}

iframe.tg{aspect-ratio:auto;height:480px;background:#fff}
.lec.done{border-right-color:#2e7d32;background:var(--donebg)}
.chk{width:100%;margin-top:10px;padding:10px;border:2px solid var(--gold);background:var(--soft);border-radius:10px;font:700 15px Tajawal,sans-serif;color:var(--ink);cursor:pointer}
.chk.on{background:#2e7d32;border-color:#2e7d32;color:#fff}
.prog{margin-bottom:12px}
.prog .goal{display:flex;justify-content:space-between;margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:700}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font:700 14px Tajawal,sans-serif;opacity:0;transition:.3s;pointer-events:none;z-index:99;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.toast.show{opacity:1}
.ann{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border:2px solid var(--gold);border-right-width:6px;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:700;font-size:14px;line-height:1.7}
.ann span{flex:1;white-space:pre-wrap}
.ann button{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
#sheet{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
#sheet .box{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;border-top:4px solid var(--gold);padding:16px}
#sheet input,#sheet textarea{width:100%;padding:12px;margin:8px 0;border:1.5px solid var(--line);border-radius:10px;font:16px Tajawal,sans-serif;background:var(--card);color:var(--ink)}
#sheet .row{display:flex;gap:8px}
#sheet .row button{flex:1;margin:10px 0 0}
.note{font-size:13px;color:var(--muted2);line-height:1.7}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border:2px solid var(--gold);background:var(--card);border-radius:10px;font:700 14px Tajawal,sans-serif;color:var(--ink);cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff}
.lbrow{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.lbrow.me{border-color:var(--gold);background:var(--soft)}
.lbrow .rk{flex:none;width:34px;text-align:center;font-weight:800;font-size:18px;color:var(--gold)}
.lbrow .nm{flex:1;font-weight:700;font-size:15px;min-width:0}
.lbrow .nm small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.lbrow b{color:var(--gold);font-size:15px;white-space:nowrap}
.lbrow.idle{opacity:.7}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--soft);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.big{width:84px;height:84px;font-size:42px;margin:6px auto}
.tt{font-style:normal;font-size:11px;background:var(--soft);color:var(--gold);border:1px solid var(--gold);border-radius:8px;padding:0 6px;margin-right:6px;font-weight:800;white-space:nowrap}
.emos{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.emos button{padding:6px 10px;border:2px solid var(--line);background:var(--card);border-radius:10px;font:700 14px Tajawal,sans-serif;color:var(--ink);cursor:pointer}
.upl{display:block;flex:1;text-align:center;cursor:pointer;margin:10px 0 0}
.star{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,var(--soft),var(--card));border:2px solid var(--gold);border-radius:18px;padding:12px 14px;margin-bottom:14px}
.star .em{font-size:34px}
.star b{color:var(--gold)}
.star small{display:block;color:var(--muted2);font-weight:400;margin-top:2px;line-height:1.6}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sbox{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.sbox b{display:block;font-size:22px;color:var(--gold)}
.sbox small{color:var(--muted);font-size:12px}
.badge-row{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;opacity:.55}
.badge-row.on{border-color:var(--gold);background:var(--soft);opacity:1}
.badge-row .b-ic{font-size:28px;width:44px;height:44px;border-radius:50%;background:var(--card);border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;flex:none}

function showGate(msg) {

function applyAccess() {
  if (allowed === null) return;
  const ok = new Set(allowed), pids = new Set();
  groups().forEach(g => teachers(g).forEach(t => {
    if (ok.has(g.key + "|" + t.key)) t.profs.forEach(f => pids.add(f.id));
  }));
  P = P.filter(p => pids.has(p.id));
  L = L.filter(l => pids.has(l.professorId));
  const used = new Set(P.map(p => p.subjectId));
  S = S.filter(s => used.has(s.id));
}

const ORD = ["اولي","ثاني","ثالث","رابع","خامس","سادس","سابع","ثامن","تاسع","عاشر"];
const ordNum = t => {
  let n = String(t || "")
    .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
    .replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه");
  const d = n.match(/\d+/);
  if (d) return +d[0];
  const i = ORD.findIndex(w => n.includes(w));
  return i < 0 ? Infinity : i + 1;
};
const baseKey = l => (typeof l.order === "number" ? l.order : ordNum(l.title));
const lecKey = l => usingData
  ? (typeof l.order === "number" ? l.order : 1e6 + ordNum(l.title))
  : ((orderMap && typeof orderMap[l.id] === "number") ? orderMap[l.id] : (orderMap ? 1e6 : 0) + baseKey(l));
const sortL = () => L.sort((a, b) => lecKey(a) - lecKey(b) || (a.title || "").localeCompare(b.title || "", "ar"));

// ---- المزامنة السحابية لتقدم الطالب (Cloud Sync) ----
async function pullCloudProgress() {
  if (!me) return;
  try {
    const snap = await getDoc(doc(db, "members", me.uid));
    if (!snap.exists()) return;
    const data = snap.data();
    if (data.doneMap && typeof data.doneMap === "object") {
      const mergedDone = { ...data.doneMap, ...getDone() };
      localStorage.setItem(DK(), JSON.stringify(mergedDone));
    }
    if (data.bmMap && typeof data.bmMap === "object") {
      const mergedBm = { ...data.bmMap, ...getBm() };
      localStorage.setItem(BK(), JSON.stringify(mergedBm));
    }
    if (data.notesMap && typeof data.notesMap === "object") {
      const mergedNotes = { ...data.notesMap, ...getNotes() };
      localStorage.setItem(NTK(), JSON.stringify(mergedNotes));
    }
    if (data.studyData && Array.isArray(data.studyData.sessions)) {
      const local = getStudy();
      if ((data.studyData.sessions.length || 0) > (local.sessions.length || 0)) {
        putStudy(data.studyData);
      }
    }
  } catch (e) {}
}

async function pushCloudProgress() {
  if (!me) return;

    await setDoc(doc(db, "members", me.uid), {
      doneMap: getDone(),

async function load() {

function ytEmbed(url) {
  const m = String(url).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  return m ? `<iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" allowfullscreen></iframe>` : "";
}
const tgMatch = url => String(url).match(/^https?:\/\/(?:t|telegram)\.me\/(?!c\/)([A-Za-z0-9_]{4,})\/(\d+)/);
function embed(url) {
  const yt = ytEmbed(url);
  if (yt) return yt;
  const t = tgMatch(url);
  return t ? `<iframe class="tg" src="https://t.me/${t[1]}/${t[2]}?embed=1&mode=tme" loading="lazy"></iframe>` : "";
}
function linkLabel(url) {
  if (ytEmbed(url) || /youtu/i.test(url)) return "▶️ فتح على يوتيوب";
  if (/(?:t|telegram)\.me\//i.test(url)) return "✈️ فتح على تليكرام";
  return "🔗 فتح الرابط";
}

const termKey = t => { const n = ordNum(t); return isFinite(n) ? "n" + n : norm(t); };
const termOf = p => { const s = S.find(x => x.id === p.subjectId); return s ? String(s.term || "").trim() : ""; };

function groups() {
  const m = new Map();
  S.forEach(s => {
    const key = norm(s.name);
    if (!m.has(key)) m.set(key, { key, name: String(s.name || "").trim(), ids: [], terms: [] });
    const g = m.get(key);
    g.ids.push(s.id);
    const t = String(s.term || "").trim();
    if (t && !g.terms.some(x => termKey(x) === termKey(t))) g.terms.push(t);
  });
  return [...m.values()];
}

function teachers(g) {
  const m = new Map();
  P.filter(p => g.ids.includes(p.subjectId)).forEach(p => {
    const key = norm(p.name);
    if (!m.has(key)) m.set(key, { key, name: String(p.name || "").trim(), photo: p.photo || "", profs: [] });
    const t = m.get(key);
    if (!t.photo && p.photo) t.photo = p.photo;
    t.profs.push({ id: p.id, term: termOf(p) });
  });
  m.forEach(t => t.profs.sort((a, b) => ordNum(a.term) - ordNum(b.term)));
  return [...m.values()];
}

function renderLectureCard(l) {
  const dn = getDone(), bm = getBm(), notes = getNotes();
  const noteTxt = notes[l.id] || "";
  return `<div class="lec ${dn[l.id] ? "done" : ""}" data-lid="${esc(l.id)}">` +
    `<div class="lec-head"><h3>🎬 ${esc(l.title)}</h3><button class="bm-btn ${bm[l.id] ? "on" : ""}" data-bm="${esc(l.id)}" title="حفظ للمراجعة">${bm[l.id] ? "⭐" : "☆"}</button></div>` +
    `${embed(l.url)}` +
    `<p><a href="${esc(l.url)}" target="_blank" rel="noopener">${linkLabel(l.url)}</a></p>` +

function move(id, dir) {
  if (!isAdmin) return;
  const list = L.filter(l => l.professorId === sel.p);
  const i = list.findIndex(l => l.id === id);
  const j = dir === "up" ? i - 1 : i + 1;
  if (i < 0 || j < 0 || j >= list.length) return;
  const a = L.indexOf(list[i]), c = L.indexOf(list[j]);
  [L[a], L[c]] = [L[c], L[a]];
  if (usingData) { L.forEach((l, k) => { l.order = k; }); }
  else { orderMap = {}; L.forEach((l, k) => { orderMap[l.id] = k; }); }
  dirty = true;
  render();
}

async function saveOrder() {
  const btn = $("saveO");
  let token = localStorage.getItem("ghtoken");
  if (!token) {
    token = (prompt("الصق مفتاح GitHub هنا (مرة وحدة فقط، ينحفظ بموبايلك):") || "").trim();
    if (!token) return;
  }
  const owner = location.hostname.split(".")[0];
  const seg = location.pathname.split("/").filter(Boolean)[0];
  const repo = (seg && !seg.includes(".")) ? seg : owner + ".github.io";
  const api = "https://api.github.com/repos/" + owner + "/" + repo + "/contents/" + (usingData ? "data.json" : "order.json");
  const h = { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" };
  const map = {};
  L.forEach((l, i) => { map[l.id] = i; });
  btn.disabled = true; btn.textContent = "⏳ جاري الحفظ...";
  try {
    let sha, out = map;
    const g = await fetch(api + "?t=" + Date.now(), { headers: h, cache: "no-store" });
    if (g.ok) {
      const j = await g.json();
      sha = j.sha;
      if (usingData) {
        const cur = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g, "")))));
        (cur.lectures || []).forEach(l => { if (typeof map[l.id] === "number") l.order = map[l.id]; });
        out = cur;
      }
    } else if (g.status !== 404 || usingData) throw new Error("GitHub " + g.status);
    const body = { message: "update lectures order", content: btoa(unescape(encodeURIComponent(JSON.stringify(out)))) };
    if (sha) body.sha = sha;
    const r = await fetch(api, { method: "PUT", headers: { ...h, "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error("GitHub " + r.status);
    localStorage.setItem("ghtoken", token);
    dirty = false;
    btn.classList.remove("dirty");
    alert("تم حفظ الترتيب ✅\nيظهر للطلاب خلال دقيقة إلى 10 دقائق.");
  } catch (e) {
    if (/401|403/.test(e.message)) localStorage.removeItem("ghtoken");
    alert("فشل الحفظ: " + e.message + (/401|403/.test(e.message) ? "\nالمفتاح غير صحيح أو ما عنده صلاحية." : ""));
  }
  btn.disabled = false; btn.textContent = "💾 حفظ الترتيب";
}

const LK = () => "last_" + (me ? me.uid : "x");
const getLast = () => { try { return JSON.parse(localStorage.getItem(LK())) || null; } catch (e) { return null; } };
function setLast(p, l) {
  const cur = getLast();
  const keep = cur && cur.p === p ? cur.l : null;
  try { localStorage.setItem(LK(), JSON.stringify({ p, l: l || keep || null })); } catch (e) {}
}
function resumeTarget() {
  const last = getLast();
  if (!last || !last.p) return null;
  const list = L.filter(l => l.professorId === last.p);
  if (!list.length) return null;
  const dn = getDone();
  let start = last.l ? list.findIndex(l => l.id === last.l) : 0;
  if (start < 0) start = 0;
  return list.slice(start).find(l => !dn[l.id]) || list.find(l => !dn[l.id]) || list[start] || list[0];

function markFilterPills() {

function runSearchAndFilter() {
  const q = norm($("q").value);
  const box = $("results");
  if (!q && curFilter === "all") { box.innerHTML = ""; $("app").style.display = ""; return; }
  $("app").style.display = "none";
  const dn = getDone(), bm = getBm(), notes = getNotes();
  const hits = L.filter(l => {

async function shareStoryCard() {
  const d = getStudy(), dn = getDone(), st = calcStreak(d.sessions);
  const hours = (d.sessions.reduce((a, s) => a + s.sec, 0) / 3600).toFixed(1);
  const doneCount = L.filter(l => dn[l.id]).length;

  const badges = getHarborBadges().filter(b => b.on);
  const rankTitle = badges.length ? badges[badges.length - 1].name : "بحّار طموح";

  const c = document.createElement("canvas");
  c.width = 720; c.height = 960;
  const ctx = c.getContext("2d");

  // خلفية كحلية متدرجة فخمة
  const bg = ctx.createLinearGradient(0, 0, 0, 960);
  bg.addColorStop(0, "#071224");
  bg.addColorStop(0.5, "#11284c");
  bg.addColorStop(1, "#08152b");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 720, 960);

  // توهج ذهبي بالوسط
  const glow = ctx.createRadialGradient(360, 260, 20, 360, 260, 340);
  glow.addColorStop(0, "rgba(232,201,100,0.28)");
  glow.addColorStop(1, "rgba(232,201,100,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, 720, 960);

  // إطار ذهبي مزدوج
  ctx.strokeStyle = "#e8c964";
  ctx.lineWidth = 4;
  ctx.strokeRect(28, 28, 664, 904);
  ctx.strokeStyle = "rgba(232,201,100,0.35)";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(40, 40, 640, 880);

  ctx.textAlign = "center";
  ctx.fillStyle = "#e8c964";
  ctx.font = "900 44px Tajawal, sans-serif";
  ctx.fillText("⚓ مرسى المعرفة", 360, 125);
  ctx.fillStyle = "#b8c7e6";
  ctx.font = "700 22px Tajawal, sans-serif";
  ctx.fillText("Knowledge Harbor • بطاقة إنجاز طالب", 360, 165);

  // اسم الطالب واللقب
  ctx.fillStyle = "#ffffff";
  ctx.font = "900 38px Tajawal, sans-serif";
  ctx.fillText(nick, 360, 250);
  ctx.fillStyle = "#e8c964";
  ctx.font = "800 24px Tajawal, sans-serif";
  ctx.fillText("الرتبة: " + rankTitle, 360, 292);

  // صناديق الإحصائيات
  const boxes = [
    { lbl: "ساعات الدراسة", val: hours + " س" },
    { lbl: "أيام الالتزام", val: st.n + " 🔥" },
    { lbl: "المحاضرات المنجزة", val: doneCount + " ✅" },
    { lbl: "عدد الجلسات", val: d.sessions.length + " 🎯" }
  ];
  boxes.forEach((b, i) => {
    const x = i % 2 === 0 ? 80 : 380;
    const y = i < 2 ? 350 : 535;
    ctx.fillStyle = "rgba(20, 42, 78, 0.85)";
    ctx.strokeStyle = "#c9a227";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.roundRect(x, y, 260, 150, 22);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = "900 40px Tajawal, sans-serif";
    ctx.fillText(b.val, x + 130, y + 78);
    ctx.fillStyle = "#e8c964";
    ctx.font = "700 22px Tajawal, sans-serif";
    ctx.fillText(b.lbl, x + 130, y + 122);
  });

  // الأوسمة المفتوحة
  ctx.fillStyle = "#ffffff";
  ctx.font = "800 26px Tajawal, sans-serif";
  ctx.fillText("الأوسمة المكتسبة: " + (badges.map(b => b.ico).join("  ") || "🛶"), 360, 765);

  ctx.font = "800 26px Tajawal, sans-serif";

let wl = null, fGoal = +localStorage.getItem("fgoal") || 0, isPomo = localStorage.getItem("fpomo") === "1", pomoBreak = false, breakStart = 0;
let fSnd = localStorage.getItem("fsnd") || "", actx = null, snode = null, fDone = false;
const lvl = sec => sec < 900 ? "مبتدئ" : sec < 2700 ? "مركّز" : sec < 5400 ? "محترف" : "أسطورة";
function ac() { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); return actx; }
function beep() {
  try { const a = ac(), o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; g.gain.value = .15; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + .4); } catch (e) {}
}
function stopSound() { try { if (snode) snode.stop(); } catch (e) {} snode = null; }
function playSound(k) {
  stopSound(); if (!k) return;
  try {
    const a = ac(), n = a.sampleRate * 2, buf = a.createBuffer(1, n, a.sampleRate), ch = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < n; i++) { const w = Math.random() * 2 - 1; ch[i] = k === "rain" ? w : (last = (last + 0.02 * w) / 1.02) * 3.5; }
    const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = buf; src.loop = true;
    f.type = k === "rain" ? "highpass" : "lowpass"; f.frequency.value = k === "rain" ? 1500 : 600;
    g.gain.value = k === "rain" ? 0.12 : 0.35;
    src.connect(f); f.connect(g); g.connect(a.destination);
    let o = null;
    if (k === "wave") { o = a.createOscillator(); const og = a.createGain(); o.frequency.value = 0.12; og.gain.value = 0.25; o.connect(og); o.connect(g.gain); o.start(); }
    src.start();
    snode = { stop() { src.stop(); if (o) o.stop(); } };
  } catch (e) {}
}

function renderChain(sec) {
  const d = getStudy(), days = new Set(d.sessions.map(x => x.d)), st = calcStreak(d.sessions), td = today();
  const wk = new Date(weekKey() + "T00:00:00"), names = ["Sat", "Sun", "Mon", "Tue", "Wed", "Thu", "Fri"], on = [];
  let tdi = -1;

function tickFocus() {
  const focusEl = $("focus");
  if (pomoBreak) {
    const bSec = Math.floor((Date.now() - breakStart) / 1000);
    const rem = Math.max(0, 300 - bSec);
    $("ftimer").textContent = fmt(rem);
    $("fgl").textContent = "☕ استراحة بومودورو (5 د)";
    const bPct = Math.min(100, Math.round(bSec / 300 * 100));
    $("ringFg").style.strokeDashoffset = String(440 - (440 * bPct) / 100);
    if (rem === 0) {
      pomoBreak = false;
      focusEl.classList.remove("break-mode");
      beep();
      toast("⏰ انتهت الاستراحة! ابدأ جولة تركيز جديدة");
      tickFocus();
    }
    return;
  }

  const run = +localStorage.getItem(RK()) || 0;
  const sec = run ? Math.floor((Date.now() - run) / 1000) : 0, tot = fGoal * 60;
  if (run && !fInit) { fInit = true; fDone = !!(tot && sec >= tot); }
  focusEl.classList.toggle("running", !!run);
  focusEl.classList.toggle("goal-done", !!(run && tot && sec >= tot));

  const fb = $("fEnd"); fb.textContent = run ? "⏹ إنهاء الجلسة" : "▶ ابدأ الجلسة"; fb.classList.toggle("end", !!run);
  $("ftimer").textContent = fmt(sec);

  const pc = tot ? Math.min(100, Math.round(sec / tot * 100)) : Math.round((sec % 3600) / 36);

  const ringEl = $("ringFg");
  if (ringEl) ringEl.style.strokeDashoffset = String(440 - (440 * (run ? pc : 0)) / 100);

  renderChain(sec);

    fDone = true;
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
    beep();
    if (isPomo) {
      toggleSession();
      pomoBreak = true;
      breakStart = Date.now();

}

      c.getContext("2d").drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, sz, sz);
      tmpPhoto = c.toDataURL("image/jpeg", 0.7);
      URL.revokeObjectURL(url); showPrev();
    };
    img.onerror = () => toast("تعذّر قراءة الصورة");
    img.src = url;
  };
  $("photoDel").onclick = () => { tmpPhoto = ""; showPrev(); };
  $("nickOk").onclick = async () => {
    const v = $("nickIn").value.trim();
    if (v.length < 2) { toast("الاسم قصير"); return; }
    try {
      localStorage.setItem(NK(), v);
      localStorage.setItem(TK(), $("ttlIn").value.trim().slice(0, 20));
      localStorage.setItem(AK(), tmpEmo);
      localStorage.setItem(PK(), tmpPhoto);
    } catch (e) { toast("تعذّر الحفظ"); return; }
    await doSync();
    cb();
  };
}

async function openBoard(tab) {
  tab = tab || "w";
  if (!isAdmin && !localStorage.getItem(NK())) { askNick(() => openBoard(tab)); return; }
  openSheet("<h2>🏆 لوحة الترتيب</h2><p>⏳ جارٍ التحميل...</p>");
  try {
    const wk = weekKey(), myId = me && me.uid;
    const q = await getDocs(collection(db, "leaderboard"));
    const rows = q.docs.map(d => ({ id: d.id, ...d.data() }));
    rows.forEach(r => { r.w = r.wk === wk ? (r.weekSec || 0) : 0; r.v = tab === "w" ? r.w : (r.score || 0); });
    rows.sort((a, b) => b.v - a.v || (b.score || 0) - (a.score || 0));
    const ranked = rows.filter(r => r.v > 0 || r.id === myId);
    const medals = ["🥇", "🥈", "🥉"];

    let html = ranked.slice(0, 20).map(row).join("");
    const mi = ranked.findIndex(r => r.id === myId);
    if (mi >= 20) html += `<p class="note" style="text-align:center">• • •</p>` + row(ranked[mi], mi);
    openSheet(`<h2>🏆 لوحة الترتيب</h2><div class="tabs"><button data-tab="w" class="${tab === "w" ? "on" : ""}">📅 هذا الأسبوع</button><button data-tab="a" class="${tab === "a" ? "on" : ""}">🏅 الإجمالي</button></div>` +
      (html || "<p>ما كو نشاط بعد، كن أول واحد! 🚀</p>") +
      `<p class="note">النقاط: كل ساعة دراسة = 10 • كل محاضرة منجزة = 2 • كل يوم بالسلسلة = 3. الأسبوع يبدأ من السبت.</p><div class="row">${isAdmin ? "" : '<button class="chk" id="nickEdit">✏️ ملفي الشخصي</button>'}<button class="chk" id="sheetX">إغلاق</button></div>`);
  } catch (e) {
    openSheet(`<h2>🏆 لوحة الترتيب</h2><p class="err">تعذّر التحميل: ${esc(e.code || e.message)}</p><button class="chk" id="sheetX">إغلاق</button>`);
  }
}

const putStudy = d => localStorage.setItem(SK(), JSON.stringify(d));
const dayStr = dt => dt.toLocaleDateString("en-CA");
const today = () => dayStr(new Date());
const fmt = n => [Math.floor(n / 3600), Math.floor(n % 3600 / 60), n % 60].map(x => String(x).padStart(2, "0")).join(":");

function calcStreak(sessions) {
  const days = new Set(sessions.map(s => s.d));
  const dt = new Date();
  const studiedToday = days.has(dayStr(dt));
  if (!studiedToday) dt.setDate(dt.getDate() - 1);
  let n = 0;
  while (days.has(dayStr(dt))) { n++; dt.setDate(dt.getDate() - 1); }
  return { n, studiedToday };
}

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مرسى المعرفة – الرئيسية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f2a43;--sea:#1f7a8c;--sand:#f2e8d5;--rope:#b8884b;--err:#b3261e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Tajawal,Tahoma,sans-serif;background:var(--sand);color:#13202c;display:none}
header{background:var(--navy);color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{margin:0;font-size:19px}
header a,#out{background:var(--rope);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:700 13px Tajawal,sans-serif;cursor:pointer;text-decoration:none}
main{max-width:640px;margin:0 auto;padding:16px}
.item{display:block;width:100%;text-align:right;background:#fffaf0;border:2px solid var(--rope);border-radius:12px;padding:14px;margin-bottom:10px;font:700 16px Tajawal,sans-serif;color:var(--navy);cursor:pointer}
.item small{display:block;color:#7a6a4a;font-weight:400;margin-top:2px}
.back{background:none;border:0;color:var(--sea);font:700 15px Tajawal,sans-serif;cursor:pointer;padding:0 0 10px}
h2{margin:0 0 12px;color:var(--navy);font-size:20px}
.lec{background:#fffaf0;border:2px solid var(--rope);border-radius:12px;padding:14px;margin-bottom:12px}
.lec h3{margin:0 0 6px;font-size:16px}
.lec p{margin:6px 0 0;font-size:14px;color:#5b6b78}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:8px;margin-top:8px}
.lec a{color:var(--sea);font-weight:700}
.gate{background:#fffaf0;border:2px solid var(--rope);border-radius:14px;padding:20px}
.gate input{width:100%;padding:12px;margin:8px 0;border:1.5px solid #cdbf9f;border-radius:8px;font:16px Tajawal,sans-serif}
.err{color:var(--err);font-weight:700;min-height:22px}
</style>
</head>
<body>
<header>
  <h1>⚓ مرسى المعرفة</h1>
  <span><a id="adminLink" href="admin.html" style="display:none">⚙️ التحكم</a> <button id="out">خروج</button></span>
</header>
<main id="app">جارٍ التحميل...</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBpZeSTo-6oOe_s8fIcxzlbCXfw9j5Oujk",
  authDomain: "knowledgeharbor-30476.firebaseapp.com",
  projectId: "knowledgeharbor-30476",
  storageBucket: "knowledgeharbor-30476.firebasestorage.app",
  messagingSenderId: "280788802817",
  appId: "1:280788802817:web:f2a7aea087fab122790f00",
  measurementId: "G-KSD4JSVTGK"
};
const ADMIN = "maniron4200@gmail.com";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S = [], P = [], L = [], sel = { s: null, p: null }, me = null;

onAuthStateChanged(auth, async u => {
  if (!u) { location.replace("login.html"); return; }
  me = u;
  document.body.style.display = "block";
  if (u.email === ADMIN) { $("adminLink").style.display = ""; load(); return; }
  try {
    const m = await getDoc(doc(db, "members", u.uid));
    if (m.exists()) { load(); return; }
  } catch (e) {}
  showGate();
});
$("out").onclick = async () => { await signOut(auth); location.replace("login.html"); };

function showGate() {
  $("app").innerHTML = `<div class="gate"><h2>🔑 كود الدخول</h2><p>اكتب الكود الي أعطاك إياه المشرف.</p><input id="code" dir="ltr" placeholder="الكود" autocomplete="off"><button class="item" id="codeBtn" style="text-align:center">دخول</button><p class="err" id="codeMsg"></p></div>`;
  $("codeBtn").onclick = async () => {
    const code = $("code").value.trim();
    if (!code) return;
    $("codeMsg").textContent = "";
    try {
      await setDoc(doc(db, "members", me.uid), { code, email: me.email });
      await load();
    } catch (e) {
      $("codeMsg").textContent = e.code === "permission-denied" ? "الكود غير صحيح." : "حدث خطأ: " + e.code;
    }
  };
}

async function load() {
  try {
    const qs = await Promise.all(["subjects","professors","lectures"].map(n => getDocs(collection(db, n))));
    const m = q => q.docs.map(d => ({ id: d.id, ...d.data() }));
    S = m(qs[0]); P = m(qs[1]); L = m(qs[2]);
    S.sort((a,b) => (a.name||"").localeCompare(b.name||"", "ar"));
    render();
  } catch (e) { $("app").textContent = "تعذّر تحميل المحتوى: " + e.code; }
}

function ytEmbed(url) {
  const m = String(url).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  return m ? `<iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" allowfullscreen></iframe>` : "";
}

function render() {
  const app = $("app");
  if (!sel.s) {
    app.innerHTML = "<h2>📚 المواد</h2>" + (S.map(s =>
      `<button class="item" data-s="${s.id}">${esc(s.name)}<small>${esc(s.term)}</small></button>`).join("") || "<p>ما كو مواد بعد.</p>");
  } else if (!sel.p) {
    const s = S.find(x => x.id === sel.s);
    app.innerHTML = `<button class="back" data-back="s">→ رجوع للمواد</button><h2>${esc(s?.name)}</h2>` +
      (P.filter(p => p.subjectId === sel.s).map(p =>
        `<button class="item" data-p="${p.id}">👨‍🏫 ${esc(p.name)}</button>`).join("") || "<p>ما كو أساتذة بعد.</p>");
  } else {
    const p = P.find(x => x.id === sel.p);
    app.innerHTML = `<button class="back" data-back="p">→ رجوع للأساتذة</button><h2>${esc(p?.name)}</h2>` +
      (L.filter(l => l.professorId === sel.p).map(l =>
        `<div class="lec"><h3>🎬 ${esc(l.title)}</h3>${ytEmbed(l.url)}<p><a href="${esc(l.url)}" target="_blank" rel="noopener">فتح على يوتيوب</a></p>${l.desc ? `<p>${esc(l.desc)}</p>` : ""}</div>`).join("") || "<p>ما كو محاضرات بعد.</p>");
  }
}

$("app").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.s) sel = { s: b.dataset.s, p: null };
  else if (b.dataset.p) sel.p = b.dataset.p;
  else if (b.dataset.back === "s") sel = { s: null, p: null };
  else if (b.dataset.back === "p") sel.p = null;
  else return;
  render();
};
</script>
</body>
</html>

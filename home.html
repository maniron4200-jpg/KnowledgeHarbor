<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مرسى المعرفة – الرئيسية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f2a43;--sea:#1f7a8c;--sand:#f2e8d5;--rope:#b8884b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Tajawal,Tahoma,sans-serif;background:var(--sand);color:#13202c;display:none}
header{background:var(--navy);color:#fff;padding:18px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{margin:0;font-size:20px}
#out{background:var(--rope);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:700 14px Tajawal,sans-serif;cursor:pointer}
main{padding:24px 16px;max-width:600px;margin:0 auto}
.card{background:#fffaf0;border:2px solid var(--rope);border-radius:14px;padding:20px}
#who{direction:ltr;word-break:break-all;font-weight:700;color:var(--sea)}
</style>
</head>
<body>
<header>
  <h1>⚓ مرسى المعرفة</h1>
  <button id="out">تسجيل الخروج</button>
</header>
<main>
  <div class="card">
    <h2>أهلاً بك 👋</h2>
    <p>أنت مسجّل بـ:</p>
    <p id="who"></p>
    <p>هنا تكدر تضيف دروسك ومحتوى المنصة.</p>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBpZeSTo-6oOe_s8fIcxzlbCXfw9j5Oujk",
  authDomain: "knowledgeharbor-30476.firebaseapp.com",
  projectId: "knowledgeharbor-30476",
  storageBucket: "knowledgeharbor-30476.firebasestorage.app",
  messagingSenderId: "280788802817",
  appId: "1:280788802817:web:f2a7aea087fab122790f00",
  measurementId: "G-KSD4JSVTGK"
};
const auth = getAuth(initializeApp(firebaseConfig));

onAuthStateChanged(auth, user => {
  if (!user) { window.location.replace("login.html"); return; }
  document.getElementById("who").textContent = user.email;
  document.body.style.display = "block";
});

document.getElementById("out").onclick = async () => {
  await signOut(auth);
  window.location.replace("login.html");
};
</script>
</body>
</html>

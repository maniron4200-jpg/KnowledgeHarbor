<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مرسى المعرفة – الرئيسية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"light"}catch(e){}</script>
<style>
:root{--ink:#3b2f14;--gold:#c9a227;--gold2:#e8c964;--soft:#fbf3dc;--line:#ead9a4;--err:#b3261e;--bg:#fffefa;--card:#fff;--muted:#9a8650;--muted2:#7a6c47;--donebg:#f4fbf4}
:root[data-theme=dark]{--ink:#f3e9c8;--soft:#2e2713;--line:#4a3f1c;--bg:#16130b;--card:#221d10;--muted:#bfae78;--muted2:#c9bb8c;--donebg:#16271a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Tajawal,Tahoma,sans-serif;background:var(--bg);color:var(--ink);display:none}
header{position:relative;background:var(--card);color:var(--ink);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:3px solid var(--gold);box-shadow:0 2px 10px rgba(201,162,39,.18)}
header h1{margin:0;font-size:20px;color:var(--gold)}
#menuBtn{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;border:0;border-radius:10px;width:42px;height:38px;font-size:20px;cursor:pointer}
#menu{display:none;position:absolute;left:16px;top:60px;z-index:20;background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:6px;min-width:170px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#menu.open{display:block}
#menu a,#menu button{display:block;width:100%;text-align:right;background:none;border:0;border-radius:10px;padding:10px 12px;font:700 14px Tajawal,sans-serif;color:var(--ink);cursor:pointer;text-decoration:none}
#menu a:active,#menu button:active{background:var(--soft)}
main{max-width:640px;margin:0 auto;padding:18px 16px}
h2{margin:0 0 14px;color:var(--ink);font-size:20px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:12px 14px;margin-bottom:10px;font:700 16px Tajawal,sans-serif;color:var(--ink);cursor:pointer;box-shadow:0 2px 8px rgba(201,162,39,.12)}
.item:active{background:var(--soft)}
.item small{display:block;color:var(--muted);font-weight:400;margin-top:2px}
.ico{flex:none;width:46px;height:46px;border-radius:50%;background:var(--soft);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:23px;overflow:hidden}
.ico img{width:100%;height:100%;object-fit:cover}
.back{background:none;border:0;color:var(--gold);font:700 15px Tajawal,sans-serif;cursor:pointer;padding:0 0 10px}
.lec{background:var(--card);border:2px solid var(--line);border-right:5px solid var(--gold);border-radius:12px;padding:14px;margin-bottom:12px}
.lec h3{margin:0 0 6px;font-size:16px}
.lec p{margin:6px 0 0;font-size:14px;color:var(--muted2)}
.lec.hl{animation:hl 1.8s ease}
@keyframes hl{0%,60%{box-shadow:0 0 0 4px var(--gold)}100%{box-shadow:0 0 0 0 transparent}}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;margin-top:8px}
.lec a{color:var(--gold);font-weight:700}
.gate{background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:20px}
.gate input{width:100%;padding:12px;margin:8px 0;border:1.5px solid var(--line);border-radius:10px;font:16px Tajawal,sans-serif;background:var(--bg);color:var(--ink)}
.err{color:var(--err);font-weight:700;min-height:22px}
.mv{display:flex;gap:8px;margin-top:10px}
.mv button{flex:1;padding:8px;border:2px solid var(--gold);background:var(--soft);border-radius:10px;font:700 15px Tajawal,sans-serif;color:var(--ink);cursor:pointer}
.mv button:active{background:var(--gold2)}
.save{width:100%;padding:12px;margin-bottom:14px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;font:800 15px Tajawal,sans-serif;cursor:pointer}
.save.dirty{outline:3px solid var(--err)}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:10px 4px;text-align:center;box-shadow:0 2px 8px rgba(201,162,39,.12)}
.stat b{display:block;font-size:22px;color:var(--gold)}
.stat small{color:var(--muted);font-size:12px}
.streak{display:flex;align-items:center;gap:8px;background:var(--soft);border:2px solid var(--gold);border-radius:14px;padding:8px 12px;margin-bottom:10px;font-weight:800;font-size:14px}
.streak b{color:var(--gold);font-size:20px}
.streak small{margin-right:auto;color:var(--muted);font-weight:400;font-size:12px}
.bar{height:10px;background:var(--soft);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(135deg,var(--gold),var(--gold2))}
.goal{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin:6px 0 10px}
.goal button{background:none;border:0;color:var(--gold);font:700 12px Tajawal,sans-serif;cursor:pointer}
.sess{width:100%;padding:12px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;font:800 16px Tajawal,sans-serif;cursor:pointer}
.sess.run{background:var(--err)}
.cont{width:100%;margin-top:8px;padding:11px 12px;border:2px solid var(--gold);border-radius:12px;background:var(--soft);color:var(--ink);font:800 14px Tajawal,sans-serif;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cont:active{background:var(--gold2)}
.quote{background:var(--soft);border:2px dashed var(--gold);border-radius:14px;padding:12px 14px;text-align:center;font-weight:700;font-size:15px;line-height:1.7;color:var(--ink);margin-bottom:14px}
.quote small{display:block;color:var(--gold);font-weight:800;margin-top:2px}
#searchWrap{display:none;max-width:640px;margin:14px auto 0;padding:0 16px}
#q{width:100%;padding:12px 14px;border:2px solid var(--gold);border-radius:14px;font:700 15px Tajawal,sans-serif;background:var(--card);color:var(--ink)}
#results{margin-top:10px}
iframe.tg{aspect-ratio:auto;height:480px;background:#fff}
.lec.done{border-right-color:#2e7d32;background:var(--donebg)}
.chk{width:100%;margin-top:10px;padding:10px;border:2px solid var(--gold);background:var(--soft);border-radius:10px;font:700 15px Tajawal,sans-serif;color:var(--ink);cursor:pointer}
.chk.on{background:#2e7d32;border-color:#2e7d32;color:#fff}
.prog{margin-bottom:12px}
.prog .goal{margin:0 0 6px;font-size:13px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font:700 14px Tajawal,sans-serif;opacity:0;transition:.3s;pointer-events:none;z-index:99;white-space:nowrap}
.toast.show{opacity:1}
.ann{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border:2px solid var(--gold);border-right-width:6px;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:700;font-size:14px;line-height:1.7}
.ann span{flex:1;white-space:pre-wrap}
.ann button{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
#sheet{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
#sheet .box{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;border-top:4px solid var(--gold);padding:16px}
#sheet input,#sheet textarea{width:100%;padding:12px;margin:8px 0;border:1.5px solid var(--line);border-radius:10px;font:16px Tajawal,sans-serif;background:var(--card);color:var(--ink)}
#sheet .row{display:flex;gap:8px}
#sheet .row button{flex:1;margin:10px 0 0}
.note{font-size:13px;color:var(--muted2);line-height:1.7}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border:2px solid var(--gold);background:var(--card);border-radius:10px;font:700 14px Tajawal,sans-serif;color:var(--ink);cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff}
.lbrow{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.lbrow.me{border-color:var(--gold);background:var(--soft)}
.lbrow .rk{flex:none;width:34px;text-align:center;font-weight:800;font-size:18px;color:var(--gold)}
.lbrow .nm{flex:1;font-weight:700;font-size:15px;min-width:0}
.lbrow .nm small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.lbrow b{color:var(--gold);font-size:15px;white-space:nowrap}
.lbrow.idle{opacity:.7}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--soft);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.big{width:84px;height:84px;font-size:42px;margin:6px auto}
.tt{font-style:normal;font-size:11px;background:var(--soft);color:var(--gold);border:1px solid var(--gold);border-radius:8px;padding:0 6px;margin-right:6px;font-weight:800;white-space:nowrap}
.emos{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.emos button{padding:6px 10px;border:2px solid var(--line);background:var(--card);border-radius:10px;font:700 14px Tajawal,sans-serif;color:var(--ink);cursor:pointer}
.upl{display:block;flex:1;text-align:center;cursor:pointer;margin:10px 0 0}
#focus{display:none;position:fixed;inset:0;z-index:60;background:#0f0c05;color:#f3e9c8;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
#focus.open{display:flex}
#focus .ft{font-size:64px;font-weight:800;color:#e8c964;letter-spacing:2px;direction:ltr;font-variant-numeric:tabular-nums}
#focus p{margin:0;font-size:16px;line-height:1.8;opacity:.85;max-width:320px}
#focus button{padding:12px 22px;border-radius:14px;border:2px solid #c9a227;background:none;color:#f3e9c8;font:800 15px Tajawal,sans-serif;cursor:pointer}
#focus button.end{background:#b3261e;border-color:#b3261e;color:#fff}
.star{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,var(--soft),var(--card));border:2px solid var(--gold);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.star .em{font-size:34px}
.star b{color:var(--gold)}
.star small{display:block;color:var(--muted2);font-weight:400;margin-top:2px;line-height:1.6}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sbox{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.sbox b{display:block;font-size:22px;color:var(--gold)}
.sbox small{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>🎓 مرسى المعرفة</h1>
  <button id="menuBtn" aria-label="القائمة">☰</button>
  <div id="menu">
    <a id="codesLink" href="codes.html" style="display:none">🔑 الأكواد</a>
    <a id="adminLink" href="admin.html" style="display:none">⚙️ التحكم</a>
    <button id="annBtn" style="display:none">📢 إعلان للطلاب</button>
    <button id="starBtn" style="display:none">🌟 طالب الأسبوع</button>
    <button id="statBtn" style="display:none">📊 إحصائيات الطلاب</button>
    <button id="themeBtn">🌙 الوضع الليلي</button>
    <button id="out">🚪 خروج</button>
  </div>
</header>
<div style="max-width:640px;margin:0 auto;padding:18px 16px 0"><div class="quote">✨ في مرسى المعرفة، كل ساعة تدرسها اليوم هي خطوة تقرّبك من حلمك، فاصبر وواصل، فالنجاح يبدأ بجلسة وحدة. ✨<small>🎓 مرسى المعرفة</small></div></div>
<div id="annWrap" style="max-width:640px;margin:0 auto;padding:0 16px"></div>
<div id="starWrap" style="max-width:640px;margin:0 auto;padding:0 16px"></div>
<div id="statsWrap" style="max-width:640px;margin:0 auto;padding:0 16px"></div>
<div id="searchWrap"><input id="q" type="search" placeholder="🔍 ابحث عن محاضرة..." autocomplete="off"><div id="results"></div></div>
<div id="sheet"></div>
<div id="focus"><div class="ft" id="ftimer">00:00:00</div><p id="fquote"></p><button class="end" id="fEnd">⏹️ إنهاء الجلسة</button><button id="fExit">↩️ خروج (الجلسة تكمل)</button></div>
<div class="toast" id="toast"></div>
<main id="app">⏳ جارٍ التحميل...</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBpZeSTo-6oOe_s8fIcxzlbCXfw9j5Oujk",
  authDomain: "knowledgeharbor-30476.firebaseapp.com",
  projectId: "knowledgeharbor-30476",
  storageBucket: "knowledgeharbor-30476.firebasestorage.app",
  messagingSenderId: "280788802817",
  appId: "1:280788802817:web:f2a7aea087fab122790f00",
  measurementId: "G-KSD4JSVTGK"
};
const ADMIN = "maniron4200@gmail.com";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S = [], P = [], L = [], sel = { s: null, t: null, p: null }, me = null, isAdmin = false, orderMap = null, dirty = false, usingData = false, allowed = null;

const ICONS = [["فيزياء","⚛️"],["كيمياء","🧪"],["أحياء","🧬"],["احياء","🧬"],["رياضيات","📐"],["عربي","📖"],["عربية","📖"],["انكليزي","🔤"],["إنكليزي","🔤"],["english","🔤"],["اسلامية","🕌"],["إسلامية","🕌"],["تاريخ","🏛️"],["جغرافية","🌍"],["حاسوب","💻"]];
const icon = n => { n = String(n || ""); const f = ICONS.find(([k]) => n.includes(k)); return f ? f[1] : "📘"; };

// توحيد الكتابة: الأحياء = الاحياء = احياء، وإزالة التشكيل والمسافات الزائدة
const norm = n => String(n || "")
  .replace(/[\u064B-\u0652\u0640]/g, "")
  .replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه")
  .replace(/\s+/g, " ").trim().toLowerCase().replace(/^ال/, "");

// ---- القائمة العلوية والوضع الليلي ----
const themeNow = () => document.documentElement.dataset.theme === "dark" ? "dark" : "light";
const syncThemeBtn = () => { $("themeBtn").textContent = themeNow() === "dark" ? "☀️ الوضع النهاري" : "🌙 الوضع الليلي"; };
syncThemeBtn();
$("themeBtn").onclick = () => {
  const t = themeNow() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("theme", t); } catch (e) {}
  syncThemeBtn();
};
$("menuBtn").onclick = e => { e.stopPropagation(); $("menu").classList.toggle("open"); };
document.addEventListener("click", e => { if (!e.target.closest("#menu")) $("menu").classList.remove("open"); });

// ---- الدخول بكود الطالب ----
// يرجع قائمة المدرسين المسموحين للطالب، أو null إذا ما عنده كود صالح
async function myAccess(u) {
  const m = await getDoc(doc(db, "members", u.uid));
  if (!m.exists() || !m.data().code) return null;
  const c = await getDoc(doc(db, "codes", String(m.data().code)));
  if (!c.exists()) return null;
  const d = c.data();
  if (!d.active || d.uid !== u.uid) return null;
  return d.teachers || [];
}

onAuthStateChanged(auth, async u => {
  if (!u) { location.replace("login.html"); return; }
  me = u;
  document.body.style.display = "block";
  if (u.email === ADMIN) { isAdmin = true; $("adminLink").style.display = ""; $("codesLink").style.display = ""; $("annBtn").style.display = ""; $("starBtn").style.display = ""; $("statBtn").style.display = ""; load(); return; }
  let a = null;
  try { a = await myAccess(u); } catch (e) {}
  if (a) { allowed = a; load(); return; }
  showGate();
});
$("out").onclick = async () => { await signOut(auth); location.replace("login.html"); };

function showGate(msg) {
  $("app").innerHTML = `<div class="gate"><h2>🔑 كود الدخول</h2><p>اكتب الكود الخاص بك الي أعطاك إياه المشرف.</p><input id="code" dir="ltr" placeholder="XXXX-XXXX" autocomplete="off"><button class="item" id="codeBtn" style="justify-content:center">✅ دخول</button><p class="err" id="codeMsg">${esc(msg || "")}</p></div>`;
  $("codeBtn").onclick = async () => {
    const code = $("code").value.trim().toUpperCase().replace(/\//g, "");
    if (!code) return;
    const msg = $("codeMsg");
    msg.textContent = "";
    try {
      const ref = doc(db, "codes", code);
      const c = await getDoc(ref);
      if (!c.exists() || !c.data().active) { msg.textContent = "الكود غير صحيح أو معطّل."; return; }
      const d = c.data();
      if (d.uid && d.uid !== me.uid) { msg.textContent = "هذا الكود مستخدم من حساب آخر. تواصل مع المشرف."; return; }
      if (!d.uid) await updateDoc(ref, { uid: me.uid, email: me.email });
      await setDoc(doc(db, "members", me.uid), { code, email: me.email });
      allowed = d.teachers || [];
      await load();
    } catch (e) {
      msg.textContent = "حدث خطأ: " + (e.code || e.message);
    }
  };
}

// يخفي كل شي ما يخص الطالب: يبقى بس المدرسين المسموحين له
function applyAccess() {
  if (allowed === null) return;
  const ok = new Set(allowed), pids = new Set();
  groups().forEach(g => teachers(g).forEach(t => {
    if (ok.has(g.key + "|" + t.key)) t.profs.forEach(f => pids.add(f.id));
  }));
  P = P.filter(p => pids.has(p.id));
  L = L.filter(l => pids.has(l.professorId));
  const used = new Set(P.map(p => p.subjectId));
  S = S.filter(s => used.has(s.id));
}

const ORD = ["اولي","ثاني","ثالث","رابع","خامس","سادس","سابع","ثامن","تاسع","عاشر"];
const ordNum = t => {
  let n = String(t || "")
    .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
    .replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه");
  const d = n.match(/\d+/);
  if (d) return +d[0];
  const i = ORD.findIndex(w => n.includes(w));
  return i < 0 ? Infinity : i + 1;
};
const baseKey = l => (typeof l.order === "number" ? l.order : ordNum(l.title));
const lecKey = l => usingData
  ? (typeof l.order === "number" ? l.order : 1e6 + ordNum(l.title))
  : ((orderMap && typeof orderMap[l.id] === "number") ? orderMap[l.id] : (orderMap ? 1e6 : 0) + baseKey(l));
const sortL = () => L.sort((a, b) => lecKey(a) - lecKey(b) || (a.title || "").localeCompare(b.title || "", "ar"));

async function load() {
  try {
    usingData = false;
    try {
      const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
      if (r.ok) {
        const d = await r.json();
        S = d.subjects || []; P = d.professors || []; L = d.lectures || [];
        usingData = true; orderMap = null;
      }
    } catch (e) { usingData = false; }
    if (!usingData) {
      try {
        const r = await fetch("order.json?t=" + Date.now(), { cache: "no-store" });
        if (r.ok) orderMap = await r.json();
      } catch (e) { orderMap = null; }
      const qs = await Promise.all(["subjects","professors","lectures"].map(n => getDocs(collection(db, n))));
      const m = q => q.docs.map(d => ({ id: d.id, ...d.data() }));
      S = m(qs[0]); P = m(qs[1]); L = m(qs[2]);
    }
    applyAccess();
    sortL();
    S.sort((a,b) => (a.name||"").localeCompare(b.name||"", "ar"));
    render();
    renderStats();
    $("searchWrap").style.display = "block";
    loadAnn(); loadStar(); syncMe();
  } catch (e) { $("app").textContent = "تعذّر تحميل المحتوى: " + (e.code || e.message); }
}

function ytEmbed(url) {
  const m = String(url).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  return m ? `<iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" allowfullscreen></iframe>` : "";
}
// تليكرام: القنوات العامة (t.me/اسم_القناة/رقم) تنعرض داخل الصفحة، والخاصة (t.me/c/...) تنفتح بالرابط
const tgMatch = url => String(url).match(/^https?:\/\/(?:t|telegram)\.me\/(?!c\/)([A-Za-z0-9_]{4,})\/(\d+)/);
function embed(url) {
  const yt = ytEmbed(url);
  if (yt) return yt;
  const t = tgMatch(url);
  return t ? `<iframe class="tg" src="https://t.me/${t[1]}/${t[2]}?embed=1&mode=tme" loading="lazy"></iframe>` : "";
}
function linkLabel(url) {
  if (ytEmbed(url) || /youtu/i.test(url)) return "▶️ فتح على يوتيوب";
  if (/(?:t|telegram)\.me\//i.test(url)) return "✈️ فتح على تليكرام";
  return "🔗 فتح الرابط";
}

const termKey = t => { const n = ordNum(t); return isFinite(n) ? "n" + n : norm(t); };
const termOf = p => { const s = S.find(x => x.id === p.subjectId); return s ? String(s.term || "").trim() : ""; };

// المادة: كل الكتابات المتشابهة (الأحياء/الاحياء) ببطاقة وحدة
function groups() {
  const m = new Map();
  S.forEach(s => {
    const key = norm(s.name);
    if (!m.has(key)) m.set(key, { key, name: String(s.name || "").trim(), ids: [], terms: [] });
    const g = m.get(key);
    g.ids.push(s.id);
    const t = String(s.term || "").trim();
    if (t && !g.terms.some(x => termKey(x) === termKey(t))) g.terms.push(t);
  });
  return [...m.values()];
}

// المدرسين داخل المادة: نفس الاسم = مدرس واحد، وفصوله داخله
function teachers(g) {
  const m = new Map();
  P.filter(p => g.ids.includes(p.subjectId)).forEach(p => {
    const key = norm(p.name);
    if (!m.has(key)) m.set(key, { key, name: String(p.name || "").trim(), photo: p.photo || "", profs: [] });
    const t = m.get(key);
    if (!t.photo && p.photo) t.photo = p.photo;
    t.profs.push({ id: p.id, term: termOf(p) });
  });
  m.forEach(t => t.profs.sort((a, b) => ordNum(a.term) - ordNum(b.term)));
  return [...m.values()];
}

function move(id, dir) {
  if (!isAdmin) return;
  const list = L.filter(l => l.professorId === sel.p);
  const i = list.findIndex(l => l.id === id);
  const j = dir === "up" ? i - 1 : i + 1;
  if (i < 0 || j < 0 || j >= list.length) return;
  const a = L.indexOf(list[i]), c = L.indexOf(list[j]);
  [L[a], L[c]] = [L[c], L[a]];
  if (usingData) { L.forEach((l, k) => { l.order = k; }); }
  else { orderMap = {}; L.forEach((l, k) => { orderMap[l.id] = k; }); }
  dirty = true;
  render();
}

async function saveOrder() {
  const btn = $("saveO");
  let token = localStorage.getItem("ghtoken");
  if (!token) {
    token = (prompt("الصق مفتاح GitHub هنا (مرة وحدة فقط، ينحفظ بموبايلك):") || "").trim();
    if (!token) return;
  }
  const owner = location.hostname.split(".")[0];
  const seg = location.pathname.split("/").filter(Boolean)[0];
  const repo = (seg && !seg.includes(".")) ? seg : owner + ".github.io";
  const api = "https://api.github.com/repos/" + owner + "/" + repo + "/contents/" + (usingData ? "data.json" : "order.json");
  const h = { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" };
  const map = {};
  L.forEach((l, i) => { map[l.id] = i; });
  btn.disabled = true; btn.textContent = "⏳ جاري الحفظ...";
  try {
    let sha, out = map;
    const g = await fetch(api + "?t=" + Date.now(), { headers: h, cache: "no-store" });
    if (g.ok) {
      const j = await g.json();
      sha = j.sha;
      if (usingData) {
        const cur = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g, "")))));
        (cur.lectures || []).forEach(l => { if (typeof map[l.id] === "number") l.order = map[l.id]; });
        out = cur;
      }
    } else if (g.status !== 404 || usingData) throw new Error("GitHub " + g.status);
    const body = { message: "update lectures order", content: btoa(unescape(encodeURIComponent(JSON.stringify(out)))) };
    if (sha) body.sha = sha;
    const r = await fetch(api, { method: "PUT", headers: { ...h, "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error("GitHub " + r.status);
    localStorage.setItem("ghtoken", token);
    dirty = false;
    btn.classList.remove("dirty");
    alert("تم حفظ الترتيب ✅\nيظهر للطلاب خلال دقيقة إلى 10 دقائق.");
  } catch (e) {
    if (/401|403/.test(e.message)) localStorage.removeItem("ghtoken");
    alert("فشل الحفظ: " + e.message + (/401|403/.test(e.message) ? "\nالمفتاح غير صحيح أو ما عنده صلاحية." : ""));
  }
  btn.disabled = false; btn.textContent = "💾 حفظ الترتيب";
}

const DK = () => "done_" + (me ? me.uid : "x");
const getDone = () => { try { return JSON.parse(localStorage.getItem(DK())) || {}; } catch (e) { return {}; } };
let tt;
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 2200); }
function progressHtml() {
  const lecs = L.filter(l => l.professorId === sel.p);
  if (!lecs.length) return "";
  const dn = getDone(), k = lecs.filter(l => dn[l.id]).length, pct = Math.round(k / lecs.length * 100);
  return `<div class="prog"><div class="goal"><span>✅ أنجزت ${k} من ${lecs.length} محاضرة</span><span>${pct}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
}
function toggleDone(id, btn) {
  const dn = getDone();
  if (dn[id]) delete dn[id]; else dn[id] = 1;
  localStorage.setItem(DK(), JSON.stringify(dn));
  const card = btn.closest(".lec");
  card.classList.toggle("done", !!dn[id]);
  btn.classList.toggle("on", !!dn[id]);
  btn.textContent = dn[id] ? "✅ تمت المشاهدة" : "⬜ علّم كمنجزة";
  const pr = document.querySelector(".prog");
  if (pr) pr.outerHTML = progressHtml();
  if (dn[id]) setLast(sel.p, id);
  renderStats();
  syncMe();
  if (dn[id]) {
    const lecs = L.filter(l => l.professorId === sel.p);
    toast(lecs.every(l => dn[l.id]) ? "🏆 ممتاز! خلصت كل محاضرات هذا الفصل" : ["👏 أحسنت!", "🌟 استمر يا بطل!", "🔥 إنجاز رائع!"][Math.floor(Math.random() * 3)]);
  }
}

// ---- كمّل من وين وقفت ----
const LK = () => "last_" + (me ? me.uid : "x");
const getLast = () => { try { return JSON.parse(localStorage.getItem(LK())) || null; } catch (e) { return null; } };
function setLast(p, l) {
  const cur = getLast();
  const keep = cur && cur.p === p ? cur.l : null;
  try { localStorage.setItem(LK(), JSON.stringify({ p, l: l || keep || null })); } catch (e) {}
}
function resumeTarget() {
  const last = getLast();
  if (!last || !last.p) return null;
  const list = L.filter(l => l.professorId === last.p);
  if (!list.length) return null;
  const dn = getDone();
  let start = last.l ? list.findIndex(l => l.id === last.l) : 0;
  if (start < 0) start = 0;
  return list.slice(start).find(l => !dn[l.id]) || list.find(l => !dn[l.id]) || list[start] || list[0];
}

// الانتقال مباشرة لمحاضرة (يستخدمه البحث وزر الكمّل)
function goTo(id) {
  const l = L.find(x => x.id === id); if (!l) return;
  const p = P.find(x => x.id === l.professorId); if (!p) return;
  const s = S.find(x => x.id === p.subjectId); if (!s) return;
  sel = { s: norm(s.name), t: norm(p.name), p: p.id };
  $("q").value = ""; $("results").innerHTML = ""; $("app").style.display = "";
  render();
  renderStats();
  const el = [...document.querySelectorAll(".lec")].find(x => x.dataset.lid === id);
  if (el) { el.scrollIntoView({ behavior: "smooth", block: "start" }); el.classList.add("hl"); }
}

  const sec = Math.floor((Date.now() - run) / 1000);

  else alert("الجلسة أقل من دقيقة، ما انحسبت.");

}

    const box = (v, t) => `<div class="sbox"><b>${v}</b><small>${t}</small></div>`;
    const ago = d => d >= 999 ? "—" : d === 0 ? "اليوم" : d === 1 ? "أمس" : "قبل " + d + " أيام";
    openSheet(`<h2>📊 إحصائيات الطلاب</h2><div class="sgrid">` +
      box(used + "/" + codes.length, "🔑 أكواد مستخدمة") + box(activeWeek + "/" + rows.length, "🟢 نشطين هذا الأسبوع") +
      box(weekH.toFixed(1), "⏱️ ساعات هذا الأسبوع") + box(totalH.toFixed(1), "⏱️ ساعات إجمالية") +
      box(doneAll, "✅ محاضرات منجزة") + box(idle, "⚠️ غائبين 3 أيام+") + `</div>` +
      (rows.slice(0, 100).map((r, i) => `<div class="lbrow ${r.days >= 3 ? "idle" : ""}"><span class="rk">${i + 1}</span><span class="av">${avHtml(r)}</span><span class="nm">${esc(r.name)}${r.title ? `<i class="tt">${esc(r.title)}</i>` : ""}<small>${esc(emailOf[r.id] || "")}</small><small>⏱️ ${((r.sec || 0) / 3600).toFixed(1)} ساعة (الأسبوع ${(r.w / 3600).toFixed(1)}) • ✅ ${r.done || 0} • 🔥 ${r.streak || 0} • آخر زيارة: ${ago(r.days)}</small></span></div>`).join("") || "<p>ما كو طلاب بلوحة الترتيب بعد.</p>") +
      `<p class="note">الإحصائيات تشمل فقط الطلاب اللي اختاروا اسم بلوحة الترتيب. الباهت يعني غايب 3 أيام أو أكثر.</p><button class="chk" id="sheetX">إغلاق</button>`);
  } catch (e) { openSheet(`<h2>📊 إحصائيات الطلاب</h2><p class="err">تعذّر التحميل: ${esc(e.code || e.message)}</p><button class="chk" id="sheetX">إغلاق</button>`); }
};

// ---- لوحة الترتيب ----
const NK = () => "nick_" + (me ? me.uid : "x");
// الأسبوع يبدأ السبت
const weekKey = () => { const d = new Date(); d.setDate(d.getDate() - (d.getDay() + 1) % 7); return dayStr(d); };
async function doSync() {
  if (!me || isAdmin) return;
  const nick = localStorage.getItem(NK());
  if (!nick) return;
  const d = getStudy(), wk = weekKey(), dn = getDone();
  const sec = d.sessions.reduce((a, s) => a + s.sec, 0);
  const weekSec = d.sessions.filter(s => s.d >= wk).reduce((a, s) => a + s.sec, 0);
  const done = L.filter(l => dn[l.id]).length;
  const streak = calcStreak(d.sessions).n;
  const score = Math.round(sec / 3600 * 10 + done * 2 + streak * 3);
  try { await setDoc(doc(db, "leaderboard", me.uid), { name: nick, title: localStorage.getItem(TK()) || "", avatar: localStorage.getItem(AK()) || "", photo: localStorage.getItem(PK()) || "", sec, weekSec, wk, done, streak, score, sessions: d.sessions.length, at: Date.now() }); } catch (e) {}
}
let syncT;
function syncMe() { clearTimeout(syncT); syncT = setTimeout(doSync, 1500); }

const TK = () => "title_" + (me ? me.uid : "x");
const AK = () => "avatar_" + (me ? me.uid : "x");
const PK = () => "photo_" + (me ? me.uid : "x");
const EMO = ["🙂", "😎", "🦁", "🦅", "🐯", "🐼", "🚀", "⭐", "🔥", "📚", "🧠", "🎓", "🌙", "⚡", "🏆", "🦉"];
const TITLES = ["المثابر", "الطموح", "نجم الأحياء", "بطل الفيزياء", "ملك الرياضيات", "صاحب الهمّة"];
let tmpEmo = "🙂", tmpPhoto = "";
function avHtml(r) {
  return r.photo && /^data:image\/(jpeg|png|webp);base64,/.test(r.photo) ? `<img src="${esc(r.photo)}" alt="">` : esc(r.avatar || "🙂");
}
function showPrev() { const e = $("avPrev"); if (e) e.innerHTML = avHtml({ photo: tmpPhoto, avatar: tmpEmo }); }
function askNick(cb) {
  tmpEmo = localStorage.getItem(AK()) || "🙂";
  tmpPhoto = localStorage.getItem(PK()) || "";
  openSheet(`<h2>👤 ملفي بلوحة الترتيب</h2><p class="note">هذي المعلومات تظهر لباقي الطلاب. تقدر تستخدم اسم مستعار.</p>` +
    `<div style="text-align:center"><span class="av big" id="avPrev"></span></div>` +
    `<div class="emos">${EMO.map(e => `<button data-emo="${e}">${e}</button>`).join("")}</div>` +
    `<div class="row"><label class="chk upl">📷 رفع صورة<input type="file" id="photoIn" accept="image/*" hidden></label><button class="chk" id="photoDel">🗑️ حذف الصورة</button></div>` +
    `<input id="nickIn" maxlength="20" placeholder="الاسم" value="${esc(localStorage.getItem(NK()) || "")}">` +
    `<input id="ttlIn" maxlength="20" placeholder="اللقب (اختياري) مثل: المثابر" value="${esc(localStorage.getItem(TK()) || "")}">` +
    `<div class="emos">${TITLES.map(t => `<button data-ttl="${t}">${t}</button>`).join("")}</div>` +
    `<div class="row"><button class="save" id="nickOk">حفظ</button><button class="chk" id="sheetX">إلغاء</button></div>`);
  showPrev();
  $("photoIn").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const sz = 120, c = document.createElement("canvas"); c.width = c.height = sz;
      const m = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, sz, sz);
      tmpPhoto = c.toDataURL("image/jpeg", 0.7);
      URL.revokeObjectURL(url); showPrev();
    };
    img.onerror = () => toast("تعذّر قراءة الصورة");
    img.src = url;
  };
  $("photoDel").onclick = () => { tmpPhoto = ""; showPrev(); };
  $("nickOk").onclick = async () => {
    const v = $("nickIn").value.trim();
    if (v.length < 2) { toast("الاسم قصير"); return; }
    try {
      localStorage.setItem(NK(), v);
      localStorage.setItem(TK(), $("ttlIn").value.trim().slice(0, 20));
      localStorage.setItem(AK(), tmpEmo);
      localStorage.setItem(PK(), tmpPhoto);
    } catch (e) { toast("تعذّر الحفظ"); return; }
    await doSync();
    cb();
  };
}

async function openBoard(tab) {
  tab = tab || "w";
  if (!isAdmin && !localStorage.getItem(NK())) { askNick(() => openBoard(tab)); return; }
  openSheet("<h2>🏆 لوحة الترتيب</h2><p>⏳ جارٍ التحميل...</p>");
  try {
    const wk = weekKey(), myId = me && me.uid;
    const q = await getDocs(collection(db, "leaderboard"));
    const rows = q.docs.map(d => ({ id: d.id, ...d.data() }));
    rows.forEach(r => { r.w = r.wk === wk ? (r.weekSec || 0) : 0; r.v = tab === "w" ? r.w : (r.score || 0); });
    rows.sort((a, b) => b.v - a.v || (b.score || 0) - (a.score || 0));
    const ranked = rows.filter(r => r.v > 0 || r.id === myId);
    const medals = ["🥇", "🥈", "🥉"];
    const row = (r, i) => `<div class="lbrow ${r.id === myId ? "me" : ""}"><span class="rk">${medals[i] || i + 1}</span><span class="av">${avHtml(r)}</span><span class="nm">${esc(r.name)}${r.title ? `<i class="tt">${esc(r.title)}</i>` : ""}<small>⏱️ ${((r.sec || 0) / 3600).toFixed(1)} ساعة • ✅ ${r.done || 0} محاضرة • 🔥 ${r.streak || 0}</small></span><b>${tab === "w" ? (r.w / 3600).toFixed(1) + " س" : (r.score || 0) + " نقطة"}</b></div>`;
    let html = ranked.slice(0, 20).map(row).join("");
    const mi = ranked.findIndex(r => r.id === myId);
    if (mi >= 20) html += `<p class="note" style="text-align:center">• • •</p>` + row(ranked[mi], mi);
    openSheet(`<h2>🏆 لوحة الترتيب</h2><div class="tabs"><button data-tab="w" class="${tab === "w" ? "on" : ""}">📅 هذا الأسبوع</button><button data-tab="a" class="${tab === "a" ? "on" : ""}">🏅 الإجمالي</button></div>` +
      (html || "<p>ما كو نشاط بعد، كن أول واحد! 🚀</p>") +
      `<p class="note">النقاط: كل ساعة دراسة = 10 • كل محاضرة منجزة = 2 • كل يوم بالسلسلة = 3. الأسبوع يبدأ من السبت.</p><div class="row">${isAdmin ? "" : '<button class="chk" id="nickEdit">✏️ ملفي الشخصي</button>'}<button class="chk" id="sheetX">إغلاق</button></div>`);
  } catch (e) {
    openSheet(`<h2>🏆 لوحة الترتيب</h2><p class="err">تعذّر التحميل: ${esc(e.code || e.message)}</p><button class="chk" id="sheetX">إغلاق</button>`);
  }
}

// ---- شريط الجلسات والساعات والإنجاز ----
const SK = () => "study_" + (me ? me.uid : "x");
const RK = () => "run_" + (me ? me.uid : "x");
const getStudy = () => { try { return JSON.parse(localStorage.getItem(SK())) || { sessions: [], goal: 2 }; } catch (e) { return { sessions: [], goal: 2 }; } };
const putStudy = d => localStorage.setItem(SK(), JSON.stringify(d));
const dayStr = dt => dt.toLocaleDateString("en-CA");
const today = () => dayStr(new Date());
const fmt = n => [Math.floor(n / 3600), Math.floor(n % 3600 / 60), n % 60].map(x => String(x).padStart(2, "0")).join(":");

// سلسلة الأيام المتتالية: يوم يُحسب إذا فيه جلسة وحدة على الأقل
function calcStreak(sessions) {
  const days = new Set(sessions.map(s => s.d));
  const dt = new Date();
  const studiedToday = days.has(dayStr(dt));
  if (!studiedToday) dt.setDate(dt.getDate() - 1);
  let n = 0;
  while (days.has(dayStr(dt))) { n++; dt.setDate(dt.getDate() - 1); }
  return { n, studiedToday };
}

function renderStats() {
  const d = getStudy(), dn = getDone();
  const run = +localStorage.getItem(RK()) || 0;
  const total = d.sessions.reduce((a, s) => a + s.sec, 0);
  const td = d.sessions.filter(s => s.d === today()).reduce((a, s) => a + s.sec, 0);
  const pct = Math.min(100, Math.round(td / 3600 / d.goal * 100));
  const st = calcStreak(d.sessions);
  const hint = st.n === 0 ? "ابدأ جلسة اليوم وابدأ سلسلتك" : (st.studiedToday ? "أحسنت، سلسلتك محفوظة اليوم ✅" : "ادرس اليوم لتحافظ على السلسلة");
  const rt = resumeTarget();
  $("statsWrap").innerHTML =
    `<div class="stats"><div class="stat"><b>${d.sessions.length}</b><small>🎯 الجلسات</small></div><div class="stat"><b>${(total / 3600).toFixed(1)}</b><small>⏱️ الساعات</small></div><div class="stat"><b>${pct}%</b><small>🏆 الإنجاز اليوم</small></div><div class="stat"><b>${L.filter(l => dn[l.id]).length}/${L.length}</b><small>✅ المحاضرات</small></div></div>` +
    `<div class="streak">🔥 <b>${st.n}</b> ${st.n === 1 ? "يوم" : "أيام"} متتالية<small>${hint}</small></div>` +
    `<div class="bar"><i style="width:${pct}%"></i></div>` +
    `<div class="goal"><span>الهدف اليومي: ${d.goal} ساعة</span><button id="goalBtn">✏️ تغيير</button></div>` +
    `<button class="sess ${run ? "run" : ""}" id="sessBtn">${run ? "⏹️ إنهاء الجلسة • <span id=\"timer\">" + fmt(Math.floor((Date.now() - run) / 1000)) + "</span>" : "▶️ ابدأ جلسة دراسة"}</button><button class="cont" id="focusBtn">🎯 وضع التركيز</button>` +
    (rt ? `<button class="cont" id="contBtn" data-lid="${esc(rt.id)}">⏯️ كمّل من وين وقفت: ${esc(rt.title)}</button>` : "") +
    `<button class="cont" id="lbBtn">🏆 لوحة الترتيب</button>`;
}
setInterval(() => {
  const run = +localStorage.getItem(RK()) || 0, t = $("timer");
  if (run && t) t.textContent = fmt(Math.floor((Date.now() - run) / 1000));
  if (run) tickFocus();
}, 1000);
$("statsWrap").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.id === "contBtn") { goTo(b.dataset.lid); return; }
  if (b.id === "lbBtn") { openBoard("w"); return; }
  if (b.id === "goalBtn") {
    const d = getStudy();
    const v = parseFloat(String(prompt("كم ساعة هدفك اليومي؟", d.goal) || "").replace(/[٠-٩]/g, c => "٠١٢٣٤٥٦٧٨٩".indexOf(c)));
    if (v > 0 && v <= 24) { d.goal = v; putStudy(d); renderStats(); }
  } else if (b.id === "sessBtn") { toggleSession(); }
  else if (b.id === "focusBtn") { openFocus(); }
};

$("app").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.id === "saveO") { saveOrder(); return; }
  if (b.dataset.done) { toggleDone(b.dataset.done, b); return; }
  if (b.dataset.mv) { move(b.dataset.id, b.dataset.mv); return; }
  const g = sel.s ? groups().find(x => x.key === sel.s) : null;
  if (b.dataset.s) sel = { s: b.dataset.s, t: null, p: null };
  else if (b.dataset.t) {
    sel.t = b.dataset.t; sel.p = null;
    const t = g && teachers(g).find(x => x.key === sel.t);
    if (t && t.profs.length === 1) sel.p = t.profs[0].id; // فصل واحد: ادخل للمحاضرات مباشرة
  }
  else if (b.dataset.p) sel.p = b.dataset.p;
  else if (b.dataset.back === "s") sel = { s: null, t: null, p: null };
  else if (b.dataset.back === "t") sel.t = sel.p = null;
  else if (b.dataset.back === "p") {
    const t = g && teachers(g).find(x => x.key === sel.t);
    if (t && t.profs.length > 1) sel.p = null; else sel.t = sel.p = null;
  }
  else return;
  render();
  renderStats();
};
</script>
</body>
</html>
